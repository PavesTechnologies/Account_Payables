          - { name: vendor_code, type: string, required: false, default: null, validation: "ignored — vendor_code is always backend-generated and unique, this field is accepted but has no effect", enum: null }
          - { name: payment_term_id, type: integer, required: false, default: null, validation: "must reference an existing payment term if provided", enum: null }
          - { name: currency_id, type: integer, required: false, default: null, validation: "must reference an existing currency if provided", enum: null }
          - { name: pan_number, type: string, required: false, default: null, validation: "must match Indian PAN format AAAAA9999A (normalized uppercase); 4th char must be a valid entity-type code; rejects placeholder/dummy PANs (rules beyond the base format skipped when gstin is provided); globally unique", enum: null }
