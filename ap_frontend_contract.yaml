  - { parent: GoodsReceipt, child: GoodsReceiptLine, relation: "one-to-many, ON DELETE CASCADE" }
  - { parent: PurchaseOrderLine, child: GoodsReceiptLine, relation: "one-to-many via po_line_id (FK, ON DELETE SET NULL) — which PO line a GRN line was received against" }
  - { parent: PurchaseOrderLine, child: InvoiceLine, relation: "one-to-many via po_line_id (FK, ON DELETE SET NULL, added 2026-08-14) — which PO line an invoice line is billing against; drives GET /apm/invoice/{id}/matching" }
  - { parent: PurchaseOrder, child: Invoice, relation: "one-to-many (FK, no cascade) — header-level PO link, independent of line-level po_line_id links" }
  - { parent: GoodsReceipt, child: Invoice, relation: "one-to-many (FK, no cascade) — header-level GRN link" }
  - { parent: Invoice, child: InvoiceApproval, relation: "one-to-many, ON DELETE CASCADE — multiple rows per invoice allowed by design (append-only decision history)" }
  - { parent: Payment, child: PaymentInvoice, relation: "one-to-many, ON DELETE CASCADE — a payment can settle multiple invoices" }
  - { parent: Invoice, child: PaymentInvoice, relation: "one-to-many (FK, no cascade) — an invoice can be paid across multiple payments/installments" }
  - { parent: VendorBank, child: Payment, relation: "one-to-many (FK, no cascade)" }

validations:
  - { endpoint: "POST /apm/vendor", field: vendor_name, rule: "required, non-empty after trim, globally unique (case-insensitive)", error_message: "vendor_name is required | A vendor with this name already exists" }
  - { endpoint: "POST/PUT /apm/vendor", field: vendor_code, rule: "unique if provided", error_message: "A vendor with this vendor_code already exists" }
  - { endpoint: "POST/PUT /apm/vendor", field: country_id, rule: "must reference an existing country", error_message: "Country not found for the given country_id" }
  - { endpoint: "POST/PUT /apm/vendor", field: payment_term_id, rule: "must reference an existing payment term", error_message: "Payment term not found for the given payment_term_id" }
  - { endpoint: "POST/PUT /apm/vendor", field: currency_id, rule: "must reference an existing currency", error_message: "Currency not found for the given currency_id" }
  - { endpoint: "POST/PUT /apm/vendor", field: pan_number, rule: "must match ^[A-Z]{5}[0-9]{4}[A-Z]$ (case-insensitive, normalized upper)", error_message: "Invalid PAN number '<value>': must match the format AAAAA9999A" }
  - { endpoint: "POST/PUT /apm/vendor", field: email, rule: "must match ^[^@\\s]+@[^@\\s]+\\.[^@\\s]+$", error_message: "Invalid email address '<value>'" }
  - { endpoint: "POST/PUT /apm/vendor", field: status_id, rule: "must reference a status row with module_name = VENDOR", error_message: "status_id must reference a valid VENDOR status" }
  - { endpoint: "POST/PUT /apm/vendor/.../addresses", field: address_line1, rule: "required, non-empty after trim", error_message: "address_line1 is required for a vendor address" }
  - { endpoint: "POST/PUT /apm/vendor/.../addresses", field: city, rule: "required, non-empty after trim", error_message: "city is required for a vendor address" }
  - { endpoint: "POST/PUT /apm/vendor/.../addresses", field: country_id, rule: "must reference an existing country", error_message: "Country not found for address country_id=<id>" }
  - { endpoint: "POST/PUT /apm/vendor/.../banks", field: bank_name, rule: "required, non-empty after trim", error_message: "bank_name is required for a vendor bank account" }
  - { endpoint: "POST/PUT /apm/vendor/.../banks", field: account_holder_name, rule: "required, non-empty after trim", error_message: "account_holder_name is required for a vendor bank account" }
  - { endpoint: "POST/PUT /apm/addresses/{id}/taxes", field: registration_type, rule: "required, non-empty after trim, unique per (vendor_address_id, registration_type)", error_message: "registration_type is required for a vendor tax entry | A tax registration of this type already exists for the address" }
  - { endpoint: "POST/PUT /apm/addresses/{id}/taxes", field: registration_number, rule: "required, non-empty after trim", error_message: "registration_number is required for a vendor tax entry" }
  - { endpoint: "POST/PUT /apm/master/tax-type", field: country_id, rule: "must reference an existing country", error_message: "Country not found for the given country_id" }
  - { endpoint: "POST/PUT /apm/master/tax-type", field: calculation_type, rule: "must be PERCENTAGE or FIXED", error_message: "Invalid calculation_type '<value>': must be one of ['FIXED', 'PERCENTAGE']" }
  - { endpoint: "POST/PUT /apm/master/tax-type", field: rate_percent, rule: "required when calculation_type = PERCENTAGE", error_message: "rate_percent is required when calculation_type is PERCENTAGE" }
  - { endpoint: "POST/PUT /apm/master/tax-type", field: fixed_amount, rule: "required when calculation_type = FIXED", error_message: "fixed_amount is required when calculation_type is FIXED" }
  - { endpoint: "POST/PUT /apm/master/tax-type", field: effective_to, rule: "must not be earlier than effective_from", error_message: "effective_to cannot be earlier than effective_from" }
  - { endpoint: "POST /apm/master/tax-type", field: "country_id + tax_code + effective_from", rule: "combination must be unique", error_message: "A tax type with this country, tax_code and effective_from already exists." }
  - { endpoint: "DELETE /apm/master/tax-type/{id}", field: is_system_default, rule: "cannot delete a system-default tax type", error_message: "System-default tax types cannot be deleted. Deactivate it instead." }
  - { endpoint: "POST /apm/master/payment-term", field: term_name, rule: "must be unique", error_message: "A payment term with this name already exists." }
  - { endpoint: "DELETE /apm/master/payment-term/{id}", field: is_system_default, rule: "cannot delete a system-default payment term", error_message: "System-default payment terms cannot be deleted. Deactivate it instead." }
  - { endpoint: "PUT /apm/master/system-configuration/{key}", field: config_value, rule: "must parse according to the config key's locked data_type (NUMBER must be float-parseable; BOOLEAN must be 'true'/'false')", error_message: "config_value '<value>' is not a valid NUMBER | config_value '<value>' is not a valid BOOLEAN (expected 'true' or 'false')" }
  - { endpoint: "POST /apm/system/country", field: country_code, rule: "must be a valid ISO 3166-1 alpha-2 code", error_message: "Invalid country code '<value>': must be a valid ISO 3166-1 alpha-2 code" }
  - { endpoint: "POST /apm/system/country", field: country_code, rule: "must be globally unique", error_message: "Country code already exists" }
  - { endpoint: "POST /apm/system/currency", field: currency_code, rule: "must be globally unique (normalized uppercase)", error_message: "Currency code already exists." }
  - { endpoint: "all mutating endpoints", field: "(implicit) auth token", rule: "decoded JWT payload must contain 'user_id' or 'sub' claim", error_message: "Token payload missing user identifier" }

integration_order:
  - "Step 1: Authenticate against UMS (external OIDC provider) to obtain a bearer JWT; attach 'Authorization: Bearer <token>' to every request except the public docs/health paths."
  - "Step 2: Prefetch static reference/lookup data used across screens: GET /apm/system/country, GET /apm/system/currency, GET /apm/master/payment-term, GET /apm/system/status?module_name=VENDOR."
  - "Step 3: Build Master Configuration screens (admin area) — Country, Currency, Status Master, Tax Type, Payment Term, System Configuration — each is a self-contained CRUD (or read+update-only for Status Master/System Configuration) using the lookups from Step 2 for country_id dropdowns on Tax Type."
  - "Step 4: Build the Vendor List screen (GET /apm/vendor) with status_id/country_id filters and search, using Step 2 lookups to render filter dropdowns and status/country labels."
  - "Step 5: Build Vendor Create (POST /apm/vendor) and Vendor Edit (PUT /apm/vendor/{id}) forms, and the Activate/Deactivate toggle (PATCH /apm/vendor/{id}/status), using Step 2 lookups for country/currency/payment-term/status selects."
  - "Step 6: Build the Vendor Detail page's Addresses tab (POST/GET/PUT/DELETE /apm/vendor/{id}/addresses[/{address_id}]), reusing the country lookup; wire the optional GSTIN auto-fill (GET /apm/system/gstin/{gstin}) as an assist action."
  - "Step 7: Build the Vendor Detail page's Bank Accounts tab (POST/GET/PUT/DELETE /apm/vendor/{id}/banks[/{bank_id}]), surfacing the primary/versioning (effective_from/effective_to) behavior in the UI."
  - "Step 8: Build the Tax Registrations sub-section nested under each address row (POST/GET/PUT/DELETE /apm/addresses/{vendor_address_id}/taxes[/{tax_id}]) — depends on Step 6 having created at least one address."
  - "Step 9: Wire cache invalidation so that any address/bank/tax mutation also invalidates the parent vendor detail query key (['vendors', vendorId]), since VendorDTO embeds all three nested collections."
  - "Step 10: Build the Invoice Upload screen calling POST /apm/invoice/process-invoice (NOT /upload-document, which is developer-only) — branch the post-upload UI on response.invoice_status: OCR_REVIEW_PENDING routes to the OCR Review screen for invoice_id; PENDING_VENDOR_ONBOARDING means no invoice exists yet and the OCR Review screen must be opened in 'assign vendor' mode against inbound_document_id instead."
  - "Step 11: Build the OCR Review screen (PATCH /apm/invoice/inbound-documents/{inbound_document_id}/ocr-review), pre-filled from the /process-invoice response's extracted_invoice/validation/vendor_match, with a vendor picker (GET /apm/vendor) shown only when invoice_id was null in Step 10."
  - "Step 12: Build the Invoice List (GET /apm/invoice-details/invoice) and Invoice Detail (GET /apm/invoice-details/invoice/{invoice_id}) screens; wire the 'view original document' action to GET /apm/invoice-details/invoice/view/{inbound_document_id}."
  - "Step 13: Build the OCR Review Queue screen (GET /apm/invoice/review-queue) as the entry point into review work — replaces manually hunting through the invoice list for OCR_REVIEW_PENDING rows. Route PATH_A rows to the existing OCR Review screen in 'confirm' mode, PATH_B rows to the same screen in 'assign vendor' mode."
  - "Step 14: Add the Matching panel (GET /apm/invoice/{id}/matching) to the Invoice Detail screen, shown whenever the invoice has a po_id — surface overall_status prominently (especially VARIANCE_DETECTED and GRN_REQUIRED_BUT_MISSING) since approvers should see this before deciding."
  - "Step 15: Build the Invoice Approval screen (POST /apm/invoice/{id}/approve, POST /apm/invoice/{id}/reject, GET /apm/invoice/{id}/approvals) — only actionable when the invoice is at PENDING_APPROVAL. Note some invoices skip this screen entirely (auto-approved via AUTO_APPROVAL_LIMIT) and will show zero approval-history rows despite being APPROVED."
  - "Step 16: Build the Purchase Order and Goods Receipt list/detail screens (GET /apm/po[...], GET /apm/grn[...]) — read-only reference screens, mainly linked to from the Matching panel (Step 14) rather than a standalone nav item."
  - "Step 17: Build the Payment screens: a Payment Creation flow (POST /apm/payment) filtered to one vendor's APPROVED/PARTIALLY_PAID invoices, a Payment List (GET /apm/payment), and per-payment status actions (PATCH /apm/payment/{id}/status) for marking Sent/Cleared/Failed."
  - "Note: no role/permission checks exist on the backend today (see the auth note at the top of this file) — every screen above is reachable by any authenticated user, including approve/reject and payment actions. Confirm with the backend team before launch whether/how UMS roles will gate these screens."

changelog:
  - date: "2026-08-13"
    change: "Added Invoice Processing/OCR, Invoice Details, and Intake sections (previously excluded as unimplemented). Corrected the orm_models exclusion list: Invoice, InvoiceLine, InvoiceIssue, InvoiceAttachment, and InboundDocument are now exposed via API; Payment, PaymentInvoice, PurchaseOrder, GoodsReceipt, and InvoiceApproval are still not implemented. Added GET /apm/health (previously whitelisted in JWT middleware with no matching route). Fixed a backend bug where GST-verified vendor auto-onboarding (Business_Layer/utils/vendor_auto_onboarding.py) always failed to parse a valid GST API response because it passed the wrong object into the parser — auto-onboarding was completely non-functional before this fix. Documented that no role/permission system exists in the backend."
  - date: "2026-08-14"
    change: >
      Every previously-excluded ORM model is now exposed via at least one endpoint — the exclusion_note/known_gaps list from 2026-08-13 is now obsolete except for authorization. Specifically: (1) DB migration added invoice_line.po_line_id (nullable FK -> purchase_order_line.po_line_id, additive, approved) to support line-level matching. (2) SQLAlchemy models added for PurchaseOrderLine and GoodsReceiptLine (tables/data already existed live in the DB with no model at all), and PurchaseOrder/GoodsReceipt models were corrected to include 8 real DB columns they were previously missing (po_date, expected_delivery_date, currency_id, subtotal, tax_amount, total_amount, grn_number, receipt_date) — no DB change needed for these, only the ORM catching up. (3) New read-only Purchase Order and Goods Receipt APIs (GET /apm/po[...], GET /apm/grn[...]). (4) New PO/GRN/Invoice matching endpoint (GET /apm/invoice/{id}/matching) computing 2-way/3-way match results with quantity/price variance detection — read-only, never auto-approves. (5) New OCR Review Queue endpoint (GET /apm/invoice/review-queue) deriving Path A/Path B queues from existing invoice/inbound_document rows — no new table. (6) New single-level Invoice Approval endpoints (POST /apm/invoice/{id}/approve|reject, GET /apm/invoice/{id}/approvals) using the existing InvoiceApproval table as-is. (7) New Payment endpoints (POST/GET /apm/payment, GET /apm/payment/{id}, PATCH /apm/payment/{id}/status) implementing the SCHEDULED->SENT->CLEARED/FAILED lifecycle against the existing Payment/PaymentInvoice schema, with remaining-payable-amount validation and invoice.amount_paid/status sync on CLEARED. (8) Wired previously-dead system_configuration flags AUTO_APPROVAL_LIMIT, PO_MANDATORY, and GRN_MANDATORY into the OCR-review and matching flows (see their lookup entries above). (9) Seeded CGST/SGST/IGST as distinct tax_type rows for India (migration), since the extraction pipeline matches line-level tax labels against tax_type.tax_code exactly and only a combined 'GST18' code existed before. (10) Authorization: role/permission enforcement is still NOT implemented — request.state.user is the raw JWT payload and no code reads a role/permission claim from it; this needs either a sample decoded UMS token or UMS claim-schema documentation before it can be built. Treat this as the primary remaining blocker before production launch.
