      related_endpoints: ["GET /apm/vendor", "GET /apm/vendor/{vendor_id}"]
      business_rules: ["Vendor is created with an empty vendor_address/vendor_bank list; those are added via their own sub-resource endpoints after the vendor exists.", "An audit_log CREATE row is written for every vendor creation.", "Do not render a Vendor Code input — vendor_code is always backend-generated; display it only after successful creation from the response/detail fetch."]

