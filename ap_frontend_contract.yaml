    - { name: VendorAddress, table: ap.vendor_address, exposed_via_api: true }
    - { name: VendorBank, table: ap.vendor_bank, exposed_via_api: true }
    - { name: VendorTax, table: ap.vendor_tax, exposed_via_api: true }
    - { name: Country, table: ap.country, exposed_via_api: true }
    - { name: Currency, table: ap.currency, exposed_via_api: true }
    - { name: PaymentTerm, table: ap.payment_term, exposed_via_api: true }
    - { name: StatusMaster, table: ap.status_master, exposed_via_api: true }
    - { name: SystemConfiguration, table: ap.system_configuration, exposed_via_api: true }
    - { name: TaxType, table: ap.tax_type, exposed_via_api: true }
