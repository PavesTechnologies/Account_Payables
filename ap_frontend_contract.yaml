    frontend: { screen: Payment Term Master (detail/edit), service_name: getPaymentTermById, react_query_key: "['payment-terms', 'id', paymentTermId]", cache: standard, loading: skeleton, pagination: none, search: none, sorting: none, filters: none, optimistic_update: n/a }
