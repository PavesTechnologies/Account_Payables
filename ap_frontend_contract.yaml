    - { name: Invoice, table: ap.invoice, exposed_via_api: true, note: "UPDATED 2026-08-13 — now exposed via /apm/invoice/process-invoice, /apm/invoice/inbound-documents/{id}/ocr-review (create/update), and /apm/invoice-details/invoice[/{id}] (read). See new Invoice Processing / Invoice Details sections below." }
    - { name: InvoiceLine, table: ap.invoice_line, exposed_via_api: true, note: "UPDATED 2026-08-13 — persisted as part of /apm/invoice/process-invoice and corrected via /apm/invoice/inbound-documents/{id}/ocr-review; no standalone read/list endpoint." }
    - { name: InvoiceIssue, table: ap.invoice_issue, exposed_via_api: true, note: "UPDATED 2026-08-13 — created automatically during /apm/invoice/process-invoice (low confidence, validation failures, line-total mismatch, unmapped currency, incomplete lines) and resolved implicitly by /apm/invoice/inbound-documents/{id}/ocr-review; no dedicated read/list/resolve endpoint exists." }
    - { name: InvoiceAttachment, table: ap.invoice_attachment, exposed_via_api: true, note: "UPDATED 2026-08-13 — created during /apm/invoice/process-invoice (points at the S3 key of the uploaded file); readable indirectly via /apm/invoice-details/invoice/view/{inbound_document_id}, not as its own resource." }
    - { name: InvoiceApproval, table: ap.invoice_approval, exposed_via_api: true, note: "UPDATED 2026-08-14 — now exposed via POST /apm/invoice/{id}/approve, POST /apm/invoice/{id}/reject, GET /apm/invoice/{id}/approvals. Single-level only (no approval_level column, by product decision — see the Invoice Approval section)." }
    - { name: Payment, table: ap.payment, exposed_via_api: true, note: "UPDATED 2026-08-14 — now exposed via POST/GET /apm/payment, GET /apm/payment/{id}, PATCH /apm/payment/{id}/status. No schema changes — used exactly as designed." }
    - { name: PaymentInvoice, table: ap.payment_invoice, exposed_via_api: true, note: "UPDATED 2026-08-14 — created as part of POST /apm/payment; readable nested under PaymentDTO.payment_invoice. No standalone endpoint (not needed — always accessed via its parent payment)." }
    - { name: PurchaseOrder, table: ap.purchase_order, exposed_via_api: true, note: "UPDATED 2026-08-14 — read-only via GET /apm/po[/{po_id}|/number/{po_number}|/{po_id}/lines]. SQLAlchemy model was also missing 6 real DB columns (po_date, expected_delivery_date, currency_id, subtotal, tax_amount, total_amount) before this update — those are now mapped; no DB change was needed, the columns already existed." }
    - { name: PurchaseOrderLine, table: ap.purchase_order_line, exposed_via_api: true, note: "NEW 2026-08-14 — this table and its data already existed live in the DB with no SQLAlchemy model at all before this update. Now exposed via GET /apm/po/{po_id} (embedded) and GET /apm/po/{po_id}/lines, and used by the matching engine via invoice_line.po_line_id / goods_receipt_line.po_line_id." }
    - { name: GoodsReceipt, table: ap.goods_receipt, exposed_via_api: true, note: "UPDATED 2026-08-14 — read-only via GET /apm/grn[/{grn_id}|/{grn_id}/lines]. SQLAlchemy model was also missing grn_number/receipt_date (real DB columns) before this update." }
    - { name: GoodsReceiptLine, table: ap.goods_receipt_line, exposed_via_api: true, note: "NEW 2026-08-14 — same situation as PurchaseOrderLine: table/data pre-existed with no model. po_line_id (nullable FK to purchase_order_line) is what makes 3-way matching possible." }
    - { name: InboundDocument, table: ap.inbound_document, exposed_via_api: true, note: "UPDATED 2026-08-13 — created by /apm/invoice/process-invoice, updated by /apm/invoice/inbound-documents/{id}/ocr-review; readable indirectly (file view via /apm/invoice-details/invoice/view/{inbound_document_id}) and via GET /apm/invoice/review-queue (Path B items). Still no direct GET-by-id for an InboundDocument row on its own." }
  exclusion_note: "As of 2026-08-14, every ORM model in Backend/Data_Access_Layer/models/__init__.py is exposed via at least one API endpoint. The only remaining backend-side gap is authorization (see the auth note at the top of this file) — not schema or missing endpoints."
  known_gaps_for_frontend:
    - "No endpoint fetches InvoiceLine/InvoiceAttachment/InvoiceIssue for an invoice directly — the closest is GET /apm/invoice-details/invoice/{invoice_id}, which returns only header fields (see InvoiceDetailsResponse), not nested lines/issues/attachments. A detail screen showing line items or open issues (or resolving/annotating an issue) needs a new/expanded backend response — not built in this phase."
    - "GET /apm/invoice-details/invoice (list-all) has no pagination, filtering, or search — will not scale to a real invoice volume as-is."
    - "PO/GRN are read-only — there is no create/update endpoint for purchase orders or goods receipts. If the product needs AP to raise POs (rather than just matching against ones raised elsewhere), that's new scope."
    - "No role/permission enforcement exists anywhere (see the auth note at the top of this file) — every authenticated user can approve/reject invoices, create/clear payments, and mutate master data. Treat this as a hard blocker for a production launch, not just a nice-to-have."
    - "Payment.payment_method and vendor_bank_id/currency_id on PaymentCreateRequest have no FK-existence validation in the service layer — a typo'd vendor_bank_id or currency_id will not 422, it will just silently store a bad reference. Validate client-side against the lookup endpoints until the backend adds server-side checks."

lookups:
  - endpoint: /apm/system/country
    values: "Dynamic, admin-managed via Country CRUD endpoints. country_code constrained to ISO 3166-1 alpha-2 (see enums.country_code)."
    used_by: ["Vendor.country_id", "VendorAddress.country_id", "TaxType.country_id"]
  - endpoint: /apm/system/currency
    values: "Dynamic, admin-managed via Currency CRUD endpoints."
    used_by: ["Vendor.currency_id"]
  - endpoint: "/apm/system/status?module_name=VENDOR"
    values: "Dynamic (seeded), read-only creation — known codes referenced in code: PENDING (default on create), ACTIVE, INACTIVE (used by the status-toggle endpoint). Full set/labels/order come from the API response."
    used_by: ["Vendor.status_id"]
  - endpoint: /apm/master/payment-term
    values: "Dynamic, admin-managed via Payment Term CRUD endpoints."
    used_by: ["Vendor.payment_term_id"]
  - endpoint: /apm/master/tax-type
    values: "Dynamic, admin-managed via Tax Type CRUD endpoints; filterable by country_id."
    used_by: ["InvoiceLine.tax_type_id (model exists but no invoice API is implemented yet — reference only)"]
  - endpoint: /apm/master/system-configuration
    values: "Dynamic, seeded key set; only config_value/description editable, keys/data_type fixed."
    used_by:
      - "AUTO_APPROVAL_LIMIT (NUMBER) — NOW WIRED 2026-08-14: PATCH /apm/invoice/inbound-documents/{id}/ocr-review auto-approves (skips PENDING_APPROVAL entirely, no InvoiceApproval row created) when invoice.net_amount <= this value AND no open invoice_issue remains."
      - "PO_MANDATORY (BOOLEAN) — NOW WIRED 2026-08-14: same endpoint raises a PO_REQUIRED (ERROR severity) invoice_issue, non-blocking, when true and the invoice has no po_id."
      - "GRN_MANDATORY (BOOLEAN) — NOW WIRED 2026-08-14: GET /apm/invoice/{id}/matching reports overall_status=GRN_REQUIRED_BUT_MISSING when true and the linked PO has no goods receipt."

enums:
  - name: calculation_type
    values: [PERCENTAGE, FIXED]
  - name: data_type (system_configuration)
    values: [STRING, NUMBER, BOOLEAN]
  - name: country_code
    values: "ISO 3166-1 alpha-2 (249 codes) — full set hardcoded in Business_Layer/utils/country_validator.py VALID_ISO_CODES"
  - name: vendor_status_code (module=VENDOR)
    values: "Not a closed enum in code beyond PENDING/ACTIVE/INACTIVE references — fetch actual set from GET /apm/system/status?module_name=VENDOR"
  - name: address_type
    values: "Not enforced/enumerated in code. Default 'REGISTERED'. Treat as free text unless product defines a fixed list (e.g. REGISTERED, BILLING, SHIPPING)."
  - name: vendor_tax.registration_type
    values: "Not enforced/enumerated in code. Free text, normalized to uppercase by the backend (e.g. GSTIN, PAN by convention — not validated)."
  - name: invoice_type
    values: [PO, NON_PO]
    note: "Backend enum (Backend/API_Layer/interface/invoice_process_interface.py InvoiceType). Auto-set to PO if a po_number was extracted, else NON_PO; also settable on manual OCR review."
  - name: invoice_status_code (module=INVOICE, status_master)
    values: [DRAFT, OCR_REVIEW_PENDING, OCR_FAILED, PENDING_APPROVAL, APPROVED, REJECTED, PARTIALLY_PAID, PAID, DISPUTED]
    note: "UPDATED 2026-08-14 — all 9 codes are real, seeded status_master rows and ALL are now reachable: OCR_FAILED/OCR_REVIEW_PENDING/PENDING_APPROVAL via /process-invoice + /ocr-review (unchanged); APPROVED/REJECTED via POST /apm/invoice/{id}/approve|reject (also APPROVED automatically via AUTO_APPROVAL_LIMIT, see system_configuration note below); PARTIALLY_PAID/PAID via PATCH /apm/payment/{id}/status when status_code=CLEARED. DISPUTED and DRAFT are seeded but no code path sets them yet. Plus one response-only value that is NEVER a status_master row: PENDING_VENDOR_ONBOARDING (surfaced only in FinalResponse.invoice_status when Path B occurs at /process-invoice — no Invoice row exists yet in that case). Fetch the authoritative full set/labels via GET /apm/system/status?module_name=INVOICE."
  - name: invoice_issue.severity
    values: [INFO, WARNING, ERROR]
    note: "DB CHECK constraint (invoice_issue_severity_check). The auto-generated issues from /process-invoice mostly use WARNING or INFO; PO_REQUIRED (see below) is the first code path to use ERROR."
  - name: invoice_issue.issue_type
    values: "Not a DB enum (no CHECK constraint). Values actually produced by current code: LOW_OCR_CONFIDENCE, VALIDATION_FAILED, LINE_TOTAL_MISMATCH, CURRENCY_UNMAPPED, LINE_ITEMS_INCOMPLETE (see Business_Layer/utils/invoice_status.py), and PO_REQUIRED (NEW 2026-08-14 — raised by PATCH /apm/invoice/inbound-documents/{id}/ocr-review when system_configuration PO_MANDATORY=true and the invoice has no po_id; non-blocking, but also blocks AUTO_APPROVAL_LIMIT auto-approval until resolved). TAX_MISMATCH and VENDOR_NOT_FOUND constants also exist but are not currently raised anywhere."
  - name: invoice_issue.issue_source
    values: "Not a DB enum. Values in use: VALIDATION, EXTRACTION. VENDOR_MATCH constant exists but is not currently used."
  - name: technical_document_type
    values: [TEXT_PDF, SCANNED_PDF, PNG, JPEG, TIFF, UNKNOWN]
    note: "Result of technical (non-business) classification in DocumentResult.technical_document_type — distinct from invoice_type."
  - name: po_status_code (module=PO, status_master)
    values: [OPEN, CLOSED, CANCELLED]
    note: "Seeded status_master rows, fetch via GET /apm/system/status?module_name=PO. Not currently set/transitioned by any backend code path (PO is read-only in this phase) — reflects whatever value the PO was created with (e.g. via direct DB insert / a future PO-creation feature)."
  - name: payment_status_code (module=PAYMENT, status_master)
    values: [SCHEDULED, SENT, CLEARED, FAILED]
    note: "NEW 2026-08-14. SCHEDULED is set on POST /apm/payment; SENT/CLEARED/FAILED via PATCH /apm/payment/{id}/status per the allowed-transition rules in that endpoint's business_rules. Fetch via GET /apm/system/status?module_name=PAYMENT."
  - name: invoice_approval.decision
    values: [PENDING, APPROVED, REJECTED]
    note: "NEW 2026-08-14. Free-text column (not FK-enforced against status_master), but a matching APPROVAL module exists in status_master with these exact codes by convention. POST /apm/invoice/{id}/approve|reject only ever write APPROVED/REJECTED — PENDING is the column's DB default and never actually written by these endpoints (a row is only created once a decision is made)."
  - name: match_type
    values: [NONE, TWO_WAY, THREE_WAY]
    note: "NEW 2026-08-14. MatchResult.match_type from GET /apm/invoice/{id}/matching. THREE_WAY whenever at least one goods_receipt_line exists for the linked PO, regardless of GRN_MANDATORY."
  - name: overall_match_status
    values: [NO_PO, MATCHED, VARIANCE_DETECTED, GRN_REQUIRED_BUT_MISSING, INCOMPLETE]
    note: "NEW 2026-08-14. MatchResult.overall_status — see the Invoice Matching endpoint's business_rules for exactly what triggers each value."
  - name: line_match_status
    values: [MATCHED, QUANTITY_VARIANCE, PRICE_VARIANCE, QUANTITY_AND_PRICE_VARIANCE, NO_PO_LINE_LINKED, NO_GRN_RECEIPT_FOUND]
    note: "NEW 2026-08-14. Per-line status inside MatchResult.lines[]. Tolerance is ±0.01 for both quantity and price."

