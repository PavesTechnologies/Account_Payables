    endpoint: /apm/vendor
    method: POST
    description: Create a vendor.
    request:
      headers: { Authorization: "Bearer <token> (required)" }
      path_params: {}
      query_params: {}
      body:
        fields:
          - { name: vendor_name, type: string, required: true, default: null, validation: "non-empty after trim; 2-200 chars; letters/digits/spaces/& . , ' - ( ) / only; not numeric-only (rules skipped when gstin is provided); globally unique (case-insensitive)", enum: null }
          - { name: country_id, type: integer, required: true, default: null, validation: "must reference an existing country", enum: null }
          - { name: vendor_code, type: string, required: false, default: null, validation: "ignored — vendor_code is always backend-generated and unique, this field is accepted but has no effect", enum: null }
          - { name: payment_term_id, type: integer, required: false, default: null, validation: "must reference an existing payment term if provided", enum: null }
          - { name: currency_id, type: integer, required: false, default: null, validation: "must reference an existing currency if provided", enum: null }
          - { name: pan_number, type: string, required: false, default: null, validation: "must match Indian PAN format AAAAA9999A (normalized uppercase); 4th char must be a valid entity-type code; rejects placeholder/dummy PANs (rules beyond the base format skipped when gstin is provided); globally unique", enum: null }
          - { name: phone_number, type: string, required: false, default: null, validation: "digits only with optional leading +; 7-15 digits; not all-zero; globally unique", enum: null }
          - { name: email, type: string, required: false, default: null, validation: "must match basic email pattern; normalized lowercase; max 150 chars; disposable-email domains rejected; globally unique", enum: null }
          - { name: status_id, type: integer, required: false, default: "resolved to the VENDOR/PENDING status if omitted", validation: "must reference a status row whose module_name = VENDOR", enum: null }
          - { name: gstin, type: string, required: false, default: null, validation: "when provided, re-verified via the GSTIN lookup service; signals GST_VERIFIED mode for this request only (not persisted) — relaxes the vendor_name/pan_number format rules above to a bare required check", enum: null }
    response:
      success: { status: 200, body: "{ vendor_id: int, message: string }" }
      error:
        - { status: 422, condition: "empty/invalid vendor_name; invalid/dummy PAN; invalid phone/email; duplicate name/vendor_code/PAN/phone/email (pre-check); country/payment_term/currency not found; invalid status_id; GSTIN verification failed; missing user identifier" }
        - { status: 409, condition: "duplicate vendor_name or vendor_code — DB unique constraint fallback" }
        - { status: 500, condition: "unexpected error" }
      model: VendorResponse
    frontend:
      screen: Vendor Create
      service_name: createVendor
