backend:
  module: Accounts Payable (AP) - Vendor Management, Master Configuration, System Defaults, Invoice Processing/OCR, Invoice Details, Intake
  base_url: /apm
  api_version: "1.0.0"
  auth:
    type: Bearer JWT (OIDC, validated via UMS OpenID Connect Discovery + JWKS)
    header: "Authorization: Bearer <access_token>"
    required: true
    public_paths: ["/", "/apm/docs", "/apm/redoc", "/apm/openapi.json", "/apm/health"]
    note: "/apm/health is now implemented (added 2026-08-13; returns {\"status\":\"healthy\"}) — previously listed as public in middleware with no matching route. All other routes (system/master/vendor/invoice/invoice-details/intake) require a valid bearer token; middleware sets request.state.user from the decoded payload. Mutating endpoints read user_id from claim 'user_id' (fallback 'sub') for created_by/updated_by/audit fields; missing claim raises 422 'Token payload missing user identifier'. NO role/permission checks exist anywhere in the backend — any authenticated user can call any endpoint, including deletes and master-data mutation. If Finance/AP-specific permission tiers are required, they must be added; do not assume they exist today."
  response_wrapper: none
  response_wrapper_note: "Routes return the Pydantic response_model JSON body directly (no {success,message,data} envelope). Backend_Layer/API_Layer/utils/response_utils.py defines success_response/error_response helpers but they are unused dead code — ignored per scan rules."

apis:
  # =========================================================
  # SYSTEM DEFAULTS — Country
  # =========================================================
  - feature: Country
    endpoint: /apm/system/country
    method: POST
    description: Create a country master record.
    request:
      headers: { Authorization: "Bearer <token> (required)", Content-Type: application/json }
      path_params: {}
      query_params: {}
      body:
        fields:
          - { name: country_name, type: string, required: true, default: null, validation: none, enum: null }
          - { name: country_code, type: string, required: true, default: null, validation: "must be a valid ISO 3166-1 alpha-2 code; normalized to uppercase", enum: null }
          - { name: is_active, type: boolean, required: false, default: true, validation: none, enum: null }
    response:
      success: { status: 201-equivalent (200 OK), body: "{ country_id: int, message: string }" }
      error:
        - { status: 422, condition: "invalid country_code or missing user identifier" }
        - { status: 409, condition: "country_code already exists (DB unique constraint)" }
        - { status: 500, condition: "unexpected error" }
      model: CountryResponse
    frontend:
      screen: Country Master
      service_name: createCountry
      react_query_key: "['countries']"
      cache: "invalidate ['countries'] on success"
      loading: button spinner
      pagination: none
      search: none
      sorting: none
      filters: none
      optimistic_update: false
    dependencies:
      lookup_apis: []
      related_endpoints: ["GET /apm/system/country", "GET /apm/system/country/{country_id}"]
      business_rules: ["country_code must be a valid ISO 3166-1 alpha-2 code", "country_code must be globally unique"]

  - feature: Country
    endpoint: /apm/system/country
    method: GET
    description: List all countries (no filters, no pagination).
    request:
      headers: { Authorization: "Bearer <token> (required)" }
      path_params: {}
      query_params: {}
      body: null
    response:
      success: { status: 200, body: "CountryDTO[]" }
      error: [{ status: 500, condition: "unexpected error" }]
      model: CountryDTO[]
    frontend:
      screen: Country Master, Vendor Create/Edit (country dropdown)
      service_name: getAllCountries
      react_query_key: "['countries']"
      cache: "long TTL (rarely changes) — treat as static reference data"
      loading: skeleton (table) / inline spinner (dropdown)
      pagination: none (returns full list)
      search: client-side only
      sorting: none (backend does not sort; order is DB-default)
      filters: none
      optimistic_update: n/a
    dependencies:
      lookup_apis: []
      related_endpoints: ["POST /apm/system/country"]
      business_rules: []

  - feature: Country
    endpoint: /apm/system/country/{country_id}
    method: GET
    description: Get a single country by ID.
    request:
      headers: { Authorization: "Bearer <token> (required)" }
      path_params: { country_id: int }
      query_params: {}
      body: null
    response:
      success: { status: 200, body: CountryDTO }
      error:
        - { status: 404, condition: "Country not found" }
        - { status: 500, condition: "unexpected error" }
      model: CountryDTO
    frontend:
      screen: Country Master (detail/edit)
      service_name: getCountryById
      react_query_key: "['countries', countryId]"
      cache: standard
      loading: skeleton
      pagination: none
      search: none
      sorting: none
      filters: none
      optimistic_update: n/a
    dependencies: { lookup_apis: [], related_endpoints: [], business_rules: [] }

  - feature: Country
    endpoint: /apm/system/country/{country_id}
    method: DELETE
    description: Delete a country. No system-default protection exists for countries (unlike tax type/payment term).
    request:
      headers: { Authorization: "Bearer <token> (required)" }
      path_params: { country_id: int }
      query_params: {}
      body: null
    response:
      success: { status: 200, body: "{ message: string }" }
      error:
        - { status: 404, condition: "Country not found" }
        - { status: 500, condition: "unexpected error (e.g. FK violation from referencing vendors/addresses/tax types is NOT caught explicitly and will surface as 500)" }
      model: DeleteCountryResponse
    frontend:
      screen: Country Master
      service_name: deleteCountry
      react_query_key: "['countries']"
      cache: "invalidate ['countries']"
      loading: confirm dialog + button spinner
      pagination: none
      search: none
      sorting: none
      filters: none
      optimistic_update: false
    dependencies:
      lookup_apis: []
      related_endpoints: []
      business_rules: ["Deleting a country referenced by vendor/vendor_address/tax_type will fail at the DB FK level and return a generic 500 — frontend should warn before allowing delete of in-use countries."]

  # =========================================================
  # SYSTEM DEFAULTS — Currency
  # =========================================================
  - feature: Currency
    endpoint: /apm/system/currency
    method: POST
    description: Create a currency master record.
    request:
      headers: { Authorization: "Bearer <token> (required)" }
      path_params: {}
      query_params: {}
      body:
        fields:
          - { name: currency_name, type: string, required: true, default: null, validation: none, enum: null }
          - { name: currency_code, type: string, required: true, default: null, validation: "normalized to uppercase; must be unique", enum: null }
          - { name: symbol, type: string, required: true, default: null, validation: none, enum: null }
          - { name: decimal_places, type: integer, required: false, default: 2, validation: none, enum: null }
          - { name: is_active, type: boolean, required: false, default: true, validation: none, enum: null }
    response:
      success: { status: 200, body: "{ currency_id: int, message: string }" }
      error:
        - { status: 422, condition: "currency_code already exists (pre-check) or missing user identifier" }
        - { status: 409, condition: "currency_code already exists (DB unique constraint fallback)" }
        - { status: 500, condition: "unexpected error" }
      model: CurrencyResponse
    frontend:
      screen: Currency Master
      service_name: createCurrency
      react_query_key: "['currencies']"
      cache: "invalidate ['currencies']"
      loading: button spinner
      pagination: none
      search: none
      sorting: none
      filters: none
      optimistic_update: false
    dependencies: { lookup_apis: [], related_endpoints: ["GET /apm/system/currency"], business_rules: ["currency_code must be globally unique (case-insensitive, stored uppercase)"] }

  - feature: Currency
    endpoint: /apm/system/currency
    method: GET
    description: List all currencies, sorted by currency_name.
    request: { headers: { Authorization: "Bearer <token> (required)" }, path_params: {}, query_params: {}, body: null }
    response: { success: { status: 200, body: "CurrencyDTO[]" }, error: [{ status: 500, condition: "unexpected error" }], model: "CurrencyDTO[]" }
    frontend:
      screen: Currency Master, Vendor Create/Edit (currency dropdown)
      service_name: getAllCurrencies
      react_query_key: "['currencies']"
      cache: "long TTL — static reference data"
      loading: skeleton / inline spinner
      pagination: none
      search: client-side
      sorting: "server pre-sorted by currency_name asc"
      filters: none
      optimistic_update: n/a
    dependencies: { lookup_apis: [], related_endpoints: [], business_rules: [] }

  - feature: Currency
    endpoint: /apm/system/currency/{currency_id}
    method: GET
    description: Get a single currency by ID.
    request: { headers: { Authorization: "Bearer <token> (required)" }, path_params: { currency_id: int }, query_params: {}, body: null }
    response:
      success: { status: 200, body: CurrencyDTO }
      error: [{ status: 404, condition: "Currency not found" }, { status: 500, condition: "unexpected error" }]
      model: CurrencyDTO
    frontend: { screen: Currency Master (detail/edit), service_name: getCurrencyById, react_query_key: "['currencies', currencyId]", cache: standard, loading: skeleton, pagination: none, search: none, sorting: none, filters: none, optimistic_update: n/a }
    dependencies: { lookup_apis: [], related_endpoints: [], business_rules: [] }

  - feature: Currency
    endpoint: /apm/system/currency/{currency_id}
    method: DELETE
    description: Delete a currency. No system-default protection.
    request: { headers: { Authorization: "Bearer <token> (required)" }, path_params: { currency_id: int }, query_params: {}, body: null }
    response:
      success: { status: 200, body: "{ message: string }" }
      error: [{ status: 404, condition: "Currency not found" }, { status: 500, condition: "FK violation if referenced by vendor surfaces as generic 500" }]
      model: DeleteCurrencyResponse
    frontend: { screen: Currency Master, service_name: deleteCurrency, react_query_key: "['currencies']", cache: "invalidate ['currencies']", loading: confirm dialog + spinner, pagination: none, search: none, sorting: none, filters: none, optimistic_update: false }
    dependencies: { lookup_apis: [], related_endpoints: [], business_rules: ["Deleting a currency in use by a vendor is not guarded in the service layer and will 500 at the DB level."] }

  # =========================================================
  # SYSTEM DEFAULTS — Status Master (read + label update only)
  # =========================================================
  - feature: Status Master
    endpoint: /apm/system/status
    method: GET
    description: List statuses, optionally filtered by module_name. Used to drive status dropdowns per module (e.g. VENDOR).
    request:
      headers: { Authorization: "Bearer <token> (required)" }
      path_params: {}
      query_params: { module_name: "string, optional — e.g. 'VENDOR'" }
      body: null
    response: { success: { status: 200, body: "StatusMasterDTO[]" }, error: [{ status: 500, condition: "unexpected error" }], model: "StatusMasterDTO[]" }
    frontend:
      screen: Status Master, Vendor Create/Edit (status dropdown), Vendor Activate/Deactivate
      service_name: getAllStatuses
      react_query_key: "['statuses', moduleName]"
      cache: "long TTL — static reference data"
      loading: inline spinner
      pagination: none
      search: none
      sorting: "server pre-sorted by module_name asc, display_order asc"
      filters: { module_name: "e.g. VENDOR" }
      optimistic_update: n/a
    dependencies: { lookup_apis: [], related_endpoints: [], business_rules: ["status_code/module_name are wired into application logic (e.g. VENDOR/PENDING, VENDOR/ACTIVE, VENDOR/INACTIVE) and cannot be created or deleted through this API — seed data only."] }

  - feature: Status Master
    endpoint: /apm/system/status/{status_id}
    method: GET
    description: Get a single status by ID.
    request: { headers: { Authorization: "Bearer <token> (required)" }, path_params: { status_id: int }, query_params: {}, body: null }
    response: { success: { status: 200, body: StatusMasterDTO }, error: [{ status: 404, condition: "Status not found" }, { status: 500, condition: "unexpected error" }], model: StatusMasterDTO }
    frontend: { screen: Status Master (detail/edit), service_name: getStatusById, react_query_key: "['statuses', 'id', statusId]", cache: standard, loading: skeleton, pagination: none, search: none, sorting: none, filters: none, optimistic_update: n/a }
    dependencies: { lookup_apis: [], related_endpoints: [], business_rules: [] }

  - feature: Status Master
    endpoint: /apm/system/status/{status_id}
    method: PUT
    description: Update a status's display label and/or sort order. status_code and module_name are immutable (locked, not accepted by the request body).
    request:
      headers: { Authorization: "Bearer <token> (required)" }
      path_params: { status_id: int }
      query_params: {}
      body:
        fields:
          - { name: status_name, type: string, required: false, default: null, validation: none, enum: null }
          - { name: display_order, type: integer, required: false, default: null, validation: none, enum: null }
    response: { success: { status: 200, body: StatusMasterDTO }, error: [{ status: 404, condition: "Status not found" }, { status: 500, condition: "unexpected error" }], model: StatusMasterDTO }
    frontend: { screen: Status Master, service_name: updateStatus, react_query_key: "['statuses']", cache: "invalidate ['statuses']", loading: button spinner, pagination: none, search: none, sorting: none, filters: none, optimistic_update: true }
    dependencies: { lookup_apis: [], related_endpoints: [], business_rules: ["status_code and module_name cannot be changed via this endpoint by design."] }

  # =========================================================
  # SYSTEM DEFAULTS — GSTIN Lookup (external integration passthrough)
  # =========================================================
  - feature: GSTIN Lookup
    endpoint: /apm/system/gstin/{gstin}
    method: GET
    description: "Looks up GST registration details for a GSTIN via an external provider (Sandbox API — search_gstin/get_access_token in Business_Layer/utils/gst_service.py + sandbox_auth.py). No local database read/write. Intended to assist Vendor Tax / Vendor Address data entry by auto-fetching registered details."
    request:
      headers: { Authorization: "Bearer <token> (required)" }
      path_params: { gstin: string }
      query_params: {}
      body: null
    response:
      success: { status: 200, body: "raw passthrough JSON from external Sandbox GST API (schema not owned by this backend)" }
      error:
        - { status: "external provider's HTTP status (proxied verbatim)", condition: "external API returned an HTTPError" }
        - { status: 500, condition: "unexpected error (e.g. missing SANDBOX_API_KEY/SANDBOX_API_SECRET env vars, network failure)" }
      model: none (unstructured dict)
    frontend:
      screen: Vendor Create/Edit — GSTIN auto-fill assist
      service_name: lookupGstin
      react_query_key: "['gstin', gstin] — fetch on-demand (manual trigger), not prefetched"
      cache: none (do not cache; always a fresh external lookup)
      loading: inline spinner on the GSTIN input
      pagination: none
      search: none
      sorting: none
      filters: none
      optimistic_update: false
    dependencies:
      lookup_apis: []
      related_endpoints: ["POST /apm/addresses/{vendor_address_id}/taxes", "POST /apm/vendor/{vendor_id}/addresses"]
      business_rules: ["Requires backend env vars SANDBOX_BASE_URL, SANDBOX_API_KEY, SANDBOX_API_SECRET to be configured; response shape is entirely defined by the third-party provider and is out of this backend's control."]

  # =========================================================
  # MASTER CONFIGURATION — Tax Type
  # =========================================================
  - feature: Tax Type
    endpoint: /apm/master/tax-type
    method: POST
    description: Create a tax type for a country (e.g. GST rate slab, withholding tax).
    request:
      headers: { Authorization: "Bearer <token> (required)" }
      path_params: {}
      query_params: {}
      body:
        fields:
          - { name: country_id, type: integer, required: true, default: null, validation: "must reference an existing country", enum: null }
          - { name: tax_name, type: string, required: true, default: null, validation: none, enum: null }
          - { name: tax_code, type: string, required: true, default: null, validation: "unique per (country_id, tax_code, effective_from)", enum: null }
          - { name: calculation_type, type: string, required: false, default: PERCENTAGE, validation: "must be PERCENTAGE or FIXED", enum: [PERCENTAGE, FIXED] }
          - { name: rate_percent, type: decimal, required: conditional, default: null, validation: "required when calculation_type=PERCENTAGE (max 6 digits, 3 decimal)", enum: null }
          - { name: fixed_amount, type: decimal, required: conditional, default: null, validation: "required when calculation_type=FIXED (max 18 digits, 2 decimal)", enum: null }
          - { name: is_withholding, type: boolean, required: false, default: false, validation: none, enum: null }
          - { name: effective_from, type: date, required: true, default: null, validation: none, enum: null }
          - { name: effective_to, type: date, required: false, default: null, validation: "must not be earlier than effective_from", enum: null }
          - { name: is_active, type: boolean, required: false, default: true, validation: none, enum: null }
    response:
      success: { status: 200, body: "{ tax_type_id: int, message: string }" }
      error:
        - { status: 422, condition: "country not found; invalid calculation_type; missing rate_percent/fixed_amount; effective_to < effective_from; duplicate (country_id, tax_code, effective_from) pre-check; missing user identifier" }
        - { status: 409, condition: "duplicate (country_id, tax_code, effective_from) — DB unique constraint fallback" }
        - { status: 500, condition: "unexpected error" }
      model: TaxTypeResponse
    frontend:
      screen: Tax Type Master
      service_name: createTaxType
      react_query_key: "['tax-types']"
      cache: "invalidate ['tax-types']"
      loading: button spinner
      pagination: none
      search: none
      sorting: none
      filters: none
      optimistic_update: false
    dependencies:
      lookup_apis: ["GET /apm/system/country"]
      related_endpoints: ["GET /apm/master/tax-type", "PUT /apm/master/tax-type/{tax_type_id}"]
      business_rules: ["is_system_default is always false for tax types created via this endpoint (seeded defaults are set at DB level, not via API)", "DB check constraint mirrors calculation_type/rate_percent/fixed_amount pairing"]

  - feature: Tax Type
    endpoint: /apm/master/tax-type
    method: GET
    description: List all tax types, optionally filtered by country, sorted by tax_name.
    request: { headers: { Authorization: "Bearer <token> (required)" }, path_params: {}, query_params: { country_id: "integer, optional" }, body: null }
    response: { success: { status: 200, body: "TaxTypeDTO[]" }, error: [{ status: 500, condition: "unexpected error" }], model: "TaxTypeDTO[]" }
    frontend:
      screen: Tax Type Master, Invoice/Line entry (future) tax dropdown
      service_name: getAllTaxTypes
      react_query_key: "['tax-types', countryId]"
      cache: medium TTL
      loading: skeleton / inline spinner
      pagination: none
      search: client-side
      sorting: "server pre-sorted by tax_name asc"
      filters: { country_id: integer }
      optimistic_update: n/a
    dependencies: { lookup_apis: ["GET /apm/system/country"], related_endpoints: [], business_rules: [] }

  - feature: Tax Type
    endpoint: /apm/master/tax-type/{tax_type_id}
    method: GET
    description: Get a single tax type by ID.
    request: { headers: { Authorization: "Bearer <token> (required)" }, path_params: { tax_type_id: int }, query_params: {}, body: null }
    response: { success: { status: 200, body: TaxTypeDTO }, error: [{ status: 404, condition: "Tax type not found" }, { status: 500, condition: "unexpected error" }], model: TaxTypeDTO }
    frontend: { screen: Tax Type Master (detail/edit), service_name: getTaxTypeById, react_query_key: "['tax-types', 'id', taxTypeId]", cache: standard, loading: skeleton, pagination: none, search: none, sorting: none, filters: none, optimistic_update: n/a }
    dependencies: { lookup_apis: [], related_endpoints: [], business_rules: [] }

  - feature: Tax Type
    endpoint: /apm/master/tax-type/{tax_type_id}
    method: PUT
    description: Update a tax type. country_id and tax_code are not updatable via this endpoint.
    request:
      headers: { Authorization: "Bearer <token> (required)" }
      path_params: { tax_type_id: int }
      query_params: {}
      body:
        fields:
          - { name: tax_name, type: string, required: false, default: null, validation: none, enum: null }
          - { name: calculation_type, type: string, required: false, default: null, validation: "must be PERCENTAGE or FIXED if provided", enum: [PERCENTAGE, FIXED] }
          - { name: rate_percent, type: decimal, required: false, default: null, validation: "re-validated against effective calculation_type", enum: null }
          - { name: fixed_amount, type: decimal, required: false, default: null, validation: "re-validated against effective calculation_type", enum: null }
          - { name: is_withholding, type: boolean, required: false, default: null, validation: none, enum: null }
          - { name: effective_from, type: date, required: false, default: null, validation: none, enum: null }
          - { name: effective_to, type: date, required: false, default: null, validation: "must not be earlier than effective_from", enum: null }
          - { name: is_active, type: boolean, required: false, default: null, validation: none, enum: null }
    response:
      success: { status: 200, body: TaxTypeDTO }
      error:
        - { status: 404, condition: "Tax type not found" }
        - { status: 422, condition: "invalid calculation_type/rate/fixed_amount combination; invalid effective range" }
        - { status: 500, condition: "unexpected error" }
      model: TaxTypeDTO
    frontend: { screen: Tax Type Master, service_name: updateTaxType, react_query_key: "['tax-types']", cache: "invalidate ['tax-types']", loading: button spinner, pagination: none, search: none, sorting: none, filters: none, optimistic_update: false }
    dependencies: { lookup_apis: [], related_endpoints: [], business_rules: ["Validation re-runs the same PERCENTAGE/FIXED pairing rule using merged (existing + incoming) values."] }

  - feature: Tax Type
    endpoint: /apm/master/tax-type/{tax_type_id}
    method: DELETE
    description: Delete a tax type. Blocked for system-default rows.
    request: { headers: { Authorization: "Bearer <token> (required)" }, path_params: { tax_type_id: int }, query_params: {}, body: null }
    response:
      success: { status: 200, body: "{ message: string }" }
      error:
        - { status: 404, condition: "Tax type not found" }
        - { status: 409, condition: "is_system_default=true — 'System-default tax types cannot be deleted. Deactivate it instead.'" }
        - { status: 500, condition: "unexpected error" }
      model: DeleteTaxTypeResponse
    frontend: { screen: Tax Type Master, service_name: deleteTaxType, react_query_key: "['tax-types']", cache: "invalidate ['tax-types']", loading: confirm dialog + spinner, pagination: none, search: none, sorting: none, filters: none, optimistic_update: false }
    dependencies: { lookup_apis: [], related_endpoints: [], business_rules: ["Disable the Delete action in the UI when is_system_default=true; suggest toggling is_active instead."] }

  # =========================================================
  # MASTER CONFIGURATION — Payment Term
  # =========================================================
  - feature: Payment Term
    endpoint: /apm/master/payment-term
    method: POST
    description: Create a payment term (e.g. Net 30, 2/10 Net 30).
    request:
      headers: { Authorization: "Bearer <token> (required)" }
      path_params: {}
      query_params: {}
      body:
        fields:
          - { name: term_name, type: string, required: true, default: null, validation: "must be unique", enum: null }
          - { name: due_days, type: integer, required: false, default: 0, validation: none, enum: null }
          - { name: discount_percent, type: decimal, required: false, default: 0, validation: "max 5 digits, 2 decimal", enum: null }
          - { name: discount_days, type: integer, required: false, default: 0, validation: none, enum: null }
          - { name: is_active, type: boolean, required: false, default: true, validation: none, enum: null }
    response:
      success: { status: 200, body: "{ payment_term_id: int, message: string }" }
      error:
        - { status: 422, condition: "term_name already exists (pre-check); missing user identifier" }
        - { status: 409, condition: "term_name already exists (DB unique constraint fallback)" }
        - { status: 500, condition: "unexpected error" }
      model: PaymentTermResponse
    frontend: { screen: Payment Term Master, service_name: createPaymentTerm, react_query_key: "['payment-terms']", cache: "invalidate ['payment-terms']", loading: button spinner, pagination: none, search: none, sorting: none, filters: none, optimistic_update: false }
    dependencies: { lookup_apis: [], related_endpoints: ["GET /apm/master/payment-term"], business_rules: ["is_system_default is always false for terms created via this endpoint"] }

  - feature: Payment Term
    endpoint: /apm/master/payment-term
    method: GET
    description: List all payment terms, sorted by term_name.
    request: { headers: { Authorization: "Bearer <token> (required)" }, path_params: {}, query_params: {}, body: null }
    response: { success: { status: 200, body: "PaymentTermDTO[]" }, error: [{ status: 500, condition: "unexpected error" }], model: "PaymentTermDTO[]" }
    frontend:
      screen: Payment Term Master, Vendor Create/Edit (payment term dropdown)
      service_name: getAllPaymentTerms
      react_query_key: "['payment-terms']"
      cache: "long TTL — static reference data"
      loading: skeleton / inline spinner
      pagination: none
      search: client-side
      sorting: "server pre-sorted by term_name asc"
      filters: none
      optimistic_update: n/a
    dependencies: { lookup_apis: [], related_endpoints: [], business_rules: [] }

  - feature: Payment Term
    endpoint: /apm/master/payment-term/{payment_term_id}
    method: GET
