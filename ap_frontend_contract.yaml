  # =========================================================
  # PO / GRN / INVOICE MATCHING (2-way / 3-way, read-only, computed) (added 2026-08-14)
  # =========================================================
  - feature: Invoice Matching
    endpoint: /apm/invoice/{invoice_id}/matching
    method: GET
    description: "Computes (does not persist) a 2-way (PO<->Invoice) or 3-way (PO<->GRN<->Invoice) match for one invoice, line by line. Uses invoice_line.po_line_id and goods_receipt_line.po_line_id to align lines; falls back to PO ordered quantity when no GRN exists. Never changes invoice status or approves anything — it only reports."
    request: { headers: { Authorization: "Bearer <token> (required)" }, path_params: { invoice_id: int }, query_params: {}, body: null }
    response:
      success: { status: 200, body: MatchResult }
      error: [{ status: 404, condition: "Invoice not found" }, { status: 500, condition: "unexpected error" }]
      model: MatchResult
    frontend:
      screen: Invoice Detail — Matching tab/panel
      service_name: getInvoiceMatching
      react_query_key: "['invoice-matching', invoiceId]"
      cache: "short TTL — recompute after any PO/GRN/invoice-line change"
      loading: skeleton
      pagination: none
      search: none
      sorting: none
      filters: none
      optimistic_update: n/a
    dependencies:
      lookup_apis: []
      related_endpoints: ["GET /apm/po/{po_id}", "GET /apm/grn/{grn_id}"]
      business_rules:
        - "overall_status values: NO_PO (invoice has no po_id — nothing to match), MATCHED (every line within tolerance: quantity ±0.01, price ±0.01), VARIANCE_DETECTED (at least one line outside tolerance), GRN_REQUIRED_BUT_MISSING (GRN_MANDATORY=true but no goods receipt is linked to the PO), INCOMPLETE (PO exists but no invoice line has po_line_id set)."
        - "match_type is NONE/TWO_WAY/THREE_WAY — THREE_WAY only when at least one goods_receipt_line exists for the PO, regardless of GRN_MANDATORY."
        - "po_mandatory/grn_mandatory in the response reflect the current system_configuration values (PO_MANDATORY, GRN_MANDATORY) at request time — purely informational here, not enforced by this endpoint."
        - "Line-level quantity_variance/price_variance are signed (invoiced minus baseline) — negative means the invoice billed LESS than ordered/received."
        - "Does NOT block or auto-approve anything — a human (or the approval endpoints) decides what to do with a VARIANCE_DETECTED result."

  # =========================================================
  # OCR REVIEW QUEUE (derived — no dedicated table) (added 2026-08-14)
  # =========================================================
  - feature: OCR Review Queue
    endpoint: /apm/invoice/review-queue
    method: GET
    description: "Combined, paginated queue of everything awaiting manual OCR action: Path A (Invoice.status_code=OCR_REVIEW_PENDING — already created, needs confirmation) and Path B (InboundDocument.extraction_status=EXTRACTED and invoice_id IS NULL — vendor never matched, needs vendor assignment). Both sets are merged and sorted by recency (created_at/received_at) before pagination is applied as one combined window — there is no separate per-path pagination."
    request:
      headers: { Authorization: "Bearer <token> (required)" }
      path_params: {}
      query_params: { skip: "integer, default 0", limit: "integer, default 50" }
      body: null
    response: { success: { status: 200, body: ReviewQueueResponse }, error: [{ status: 500, condition: "unexpected error" }], model: ReviewQueueResponse }
    frontend:
      screen: OCR Review Queue
      service_name: getReviewQueue
      react_query_key: "['review-queue', { skip, limit }]"
      cache: "short TTL; invalidate on /process-invoice and /ocr-review success"
      loading: skeleton table
      pagination: "offset-based via skip/limit over the COMBINED (Path A + Path B) list; total_path_a/total_path_b give per-path counts for a tab/badge count, but there is no single combined total field — infer 'has more' from items.length == limit"
      search: none
      sorting: "server pre-sorted by recency (created_at for Path A, received_at for Path B) descending"
      filters: "none server-side — each item.path is PATH_A or PATH_B for client-side tab filtering"
      optimistic_update: n/a
    dependencies:
      lookup_apis: []
      related_endpoints: ["PATCH /apm/invoice/inbound-documents/{inbound_document_id}/ocr-review"]
      business_rules: ["Every item has inbound_document_id populated (both paths originate from an InboundDocument); PATH_A items additionally have invoice_id/invoice_number/net_amount populated, PATH_B items have file_name/extraction_confidence populated instead — branch the row rendering on item.path.", "Clicking a PATH_B row should open the OCR Review screen in 'assign vendor' mode (vendor_id required in the PATCH body); a PATH_A row opens it in 'confirm/correct' mode."]

  # =========================================================
  # INVOICE APPROVAL (single-level) (added 2026-08-14)
  # =========================================================
  # Uses the existing InvoiceApproval table as-is — no approval_level column,
  # no new table. Multiple rows per invoice_id are allowed by design, so the
  # decision history in GET .../approvals is a natural append-only log.
  - feature: Invoice Approval
    endpoint: /apm/invoice/{invoice_id}/approve
    method: POST
    description: Approve an invoice currently at PENDING_APPROVAL. Creates an InvoiceApproval row (decision=APPROVED) and moves the invoice to APPROVED.
    request:
      headers: { Authorization: "Bearer <token> (required)" }
      path_params: { invoice_id: int }
      query_params: {}
      body: { fields: [{ name: comments, type: string, required: false, default: null, validation: none, enum: null }] }
    response:
      success: { status: 200, body: "{ invoice_id: int, invoice_approval_id: int, status_code: 'APPROVED', message: string }" }
      error:
        - { status: 404, condition: "Invoice not found" }
        - { status: 422, condition: "Invoice is not currently PENDING_APPROVAL; missing user identifier; APPROVED status not configured in status_master" }
        - { status: 500, condition: "unexpected error" }
      model: InvoiceApprovalActionResponse
    frontend:
      screen: Invoice Approval
      service_name: approveInvoice
      react_query_key: "none (mutation) — invalidate ['invoice-details', invoiceId], ['invoice-details'] list, ['invoice-matching', invoiceId], and ['invoice-approvals', invoiceId] on success"
      cache: "invalidate on success"
      loading: button spinner + confirm dialog
      pagination: none
      search: none
      sorting: none
      filters: none
      optimistic_update: false
    dependencies:
      lookup_apis: ["GET /apm/invoice/{invoice_id}/matching (show the approver the match result before they decide)"]
      related_endpoints: ["GET /apm/invoice/{invoice_id}/approvals"]
      business_rules: ["Approver identity comes from the JWT (user_id/sub claim) — there is no approver-role check today (see backend auth note at the top of this file).", "No AUTO_APPROVAL_LIMIT check happens here — that only fires automatically inside PATCH .../ocr-review when the invoice first reaches PENDING_APPROVAL. Calling this endpoint on an invoice already auto-approved will 422 (not PENDING_APPROVAL)."]

  - feature: Invoice Approval
    endpoint: /apm/invoice/{invoice_id}/reject
    method: POST
    description: Reject an invoice currently at PENDING_APPROVAL. comments is REQUIRED here (the rejection reason) — unlike approve, where it's optional.
    request:
      headers: { Authorization: "Bearer <token> (required)" }
      path_params: { invoice_id: int }
      query_params: {}
      body: { fields: [{ name: comments, type: string, required: true, default: null, validation: "rejection reason", enum: null }] }
    response:
      success: { status: 200, body: "{ invoice_id: int, invoice_approval_id: int, status_code: 'REJECTED', message: string }" }
      error:
        - { status: 404, condition: "Invoice not found" }
        - { status: 422, condition: "Invoice is not currently PENDING_APPROVAL; missing comments (422 from FastAPI body validation, before the route even runs); missing user identifier; REJECTED status not configured in status_master" }
        - { status: 500, condition: "unexpected error" }
      model: InvoiceApprovalActionResponse
    frontend: { screen: Invoice Approval, service_name: rejectInvoice, react_query_key: "none (mutation) — same invalidation set as approve", cache: "invalidate on success", loading: "button spinner + confirm dialog with a required reason textarea", pagination: none, search: none, sorting: none, filters: none, optimistic_update: false }
    dependencies: { lookup_apis: [], related_endpoints: ["GET /apm/invoice/{invoice_id}/approvals"], business_rules: ["There is no 'un-reject' or re-approval path from REJECTED in this backend — it's a terminal status."] }

  - feature: Invoice Approval
    endpoint: /apm/invoice/{invoice_id}/approvals
    method: GET
    description: Full approval decision history for an invoice (every InvoiceApproval row, oldest first) — normally 0 or 1 rows today (single-level approval), but the table supports more.
    request: { headers: { Authorization: "Bearer <token> (required)" }, path_params: { invoice_id: int }, query_params: {}, body: null }
    response: { success: { status: 200, body: "InvoiceApprovalDTO[]" }, error: [{ status: 404, condition: "Invoice not found" }, { status: 500, condition: "unexpected error" }], model: "InvoiceApprovalDTO[]" }
    frontend: { screen: Invoice Detail — Approval History panel, service_name: getInvoiceApprovalHistory, react_query_key: "['invoice-approvals', invoiceId]", cache: "invalidate on approve/reject", loading: skeleton list, pagination: none, search: none, sorting: "oldest first (created_at asc)", filters: none, optimistic_update: n/a }
    dependencies: { lookup_apis: [], related_endpoints: [], business_rules: ["An invoice auto-approved via AUTO_APPROVAL_LIMIT will have ZERO rows here (per Database/Database_README.md Module 6, the fully-automated path never touches invoice_approval) even though its status is APPROVED — do not assume APPROVED implies a history row exists."] }

  # =========================================================
  # PAYMENT (added 2026-08-14)
  # =========================================================
  # Uses the existing Payment/PaymentInvoice schema as-is — no schema
  # changes. invoice.amount_paid is only updated when a payment reaches
  # CLEARED; SCHEDULED/SENT allocations "reserve" the balance (see
  # business_rules) without moving money yet.
  - feature: Payment
    endpoint: /apm/payment
    method: POST
    description: Create a payment (status SCHEDULED) allocated against one or more invoices in one transaction.
    request:
      headers: { Authorization: "Bearer <token> (required)" }
      path_params: {}
      query_params: {}
      body:
        fields:
          - { name: vendor_id, type: integer, required: true, default: null, validation: "must exist; every allocated invoice must belong to this vendor", enum: null }
          - { name: scheduled_date, type: date, required: true, default: null, validation: none, enum: null }
          - { name: currency_id, type: integer, required: true, default: null, validation: "must reference an existing currency (no FK existence check performed by this endpoint today)", enum: null }
          - { name: payment_method, type: string, required: true, default: null, validation: "free text — no enum enforced (e.g. NEFT, RTGS, WIRE, CHEQUE by convention)", enum: null }
          - { name: vendor_bank_id, type: integer, required: false, default: null, validation: "no FK existence check performed by this endpoint today", enum: null }
          - { name: reference_number, type: string, required: false, default: null, validation: none, enum: null }
          - { name: allocations, type: "array of {invoice_id, allocated_amount}", required: true, default: null, validation: "at least 1 entry; each allocated_amount > 0 and <= that invoice's remaining payable amount (net_amount - amount_paid - amount already reserved by other non-FAILED SCHEDULED/SENT payments); each invoice must be APPROVED or PARTIALLY_PAID and belong to vendor_id", enum: null }
      note: "This is the one endpoint outside master-data create/update routes that validates multiple related rows (every allocation's invoice) inside a single all-or-nothing transaction — any failure rolls back the whole payment, not just the offending allocation."
    response:
      success: { status: 200, body: "{ payment_id: int, message: string }" }
      error:
        - { status: 404, condition: "vendor_id or an allocation's invoice_id not found" }
        - { status: 422, condition: "invoice not payable (not APPROVED/PARTIALLY_PAID); invoice belongs to a different vendor; allocated_amount <= 0; allocated_amount exceeds remaining payable amount; SCHEDULED status not configured in status_master" }
        - { status: 500, condition: "unexpected error" }
      model: PaymentResponse
    frontend:
      screen: Payment Creation — Vendor Payment Run
      service_name: createPayment
      react_query_key: "none (mutation) — invalidate ['payments'], and ['invoice-details', invoiceId] + ['invoice-details'] list for every allocated invoice"
      cache: "invalidate on success"
      loading: button spinner
      pagination: none
      search: none
      sorting: none
      filters: none
      optimistic_update: false
    dependencies:
      lookup_apis: ["GET /apm/invoice-details/invoice (filter client-side to this vendor's APPROVED/PARTIALLY_PAID invoices)", "GET /apm/vendor/{vendor_id}/banks", "GET /apm/system/currency"]
      related_endpoints: ["GET /apm/payment", "PATCH /apm/payment/{payment_id}/status"]
      business_rules:
        - "'Remaining payable amount' accounts for OTHER in-flight (SCHEDULED/SENT, not yet CLEARED) payments already allocated to the same invoice — the frontend cannot rely on invoice.net_amount - invoice.amount_paid alone to compute what's still allocatable; always attempt the allocation and surface the 422 message, or (better) call GET /apm/payment?vendor_id=... first to see what's already reserved."
        - "total_amount is computed server-side as the sum of all allocations — do not send it."

  - feature: Payment
    endpoint: /apm/payment
    method: GET
    description: List payments with optional vendor/status filtering. Each payment includes its invoice allocations eager-loaded.
    request:
      headers: { Authorization: "Bearer <token> (required)" }
      path_params: {}
      query_params: { vendor_id: "integer, optional", status_id: "integer, optional — see enums.payment_status_code", skip: "integer, default 0", limit: "integer, default 100" }
      body: null
    response: { success: { status: 200, body: "PaymentDTO[]" }, error: [{ status: 500, condition: "unexpected error" }], model: "PaymentDTO[]" }
    frontend: { screen: Payment List, service_name: getAllPayments, react_query_key: "['payments', { vendorId, statusId, skip, limit }]", cache: "short TTL", loading: skeleton table, pagination: "offset-based via skip/limit, no total-count field", search: none, sorting: "server pre-sorted by payment_id desc", filters: { vendor_id: integer, status_id: integer }, optimistic_update: n/a }
    dependencies: { lookup_apis: ["GET /apm/system/status?module_name=PAYMENT"], related_endpoints: ["GET /apm/payment/{payment_id}"], business_rules: [] }

  - feature: Payment
    endpoint: /apm/payment/{payment_id}
    method: GET
    description: Get a single payment with its invoice allocations.
    request: { headers: { Authorization: "Bearer <token> (required)" }, path_params: { payment_id: int }, query_params: {}, body: null }
    response: { success: { status: 200, body: PaymentDTO }, error: [{ status: 404, condition: "Payment not found" }, { status: 500, condition: "unexpected error" }], model: PaymentDTO }
    frontend: { screen: Payment Detail, service_name: getPaymentById, react_query_key: "['payments', paymentId]", cache: standard, loading: skeleton, pagination: none, search: none, sorting: none, filters: none, optimistic_update: n/a }
    dependencies: { lookup_apis: [], related_endpoints: [], business_rules: [] }

  - feature: Payment
    endpoint: /apm/payment/{payment_id}/status
    method: PATCH
    description: "Transition a payment's status. Allowed transitions: SCHEDULED -> SENT, SCHEDULED -> FAILED, SENT -> CLEARED, SENT -> FAILED. CLEARED and FAILED are terminal. Reaching CLEARED increments amount_paid on every allocated invoice and moves each to PARTIALLY_PAID or PAID."
    request:
      headers: { Authorization: "Bearer <token> (required)" }
      path_params: { payment_id: int }
      query_params: {}
      body:
        fields:
          - { name: status_code, type: string, required: true, default: null, validation: "must be a valid next state from the current one (see description)", enum: [SENT, CLEARED, FAILED] }
          - { name: payment_date, type: date, required: false, default: "today, only when status_code=CLEARED", validation: none, enum: null }
          - { name: reference_number, type: string, required: false, default: null, validation: "overwrites the existing reference_number if provided", enum: null }
    response:
      success: { status: 200, body: PaymentDTO }
      error:
        - { status: 404, condition: "Payment not found" }
        - { status: 422, condition: "invalid transition from the current status; status_code not configured in status_master" }
        - { status: 500, condition: "unexpected error" }
      model: PaymentDTO
    frontend:
      screen: Payment Detail — status actions (Mark Sent / Mark Cleared / Mark Failed)
      service_name: updatePaymentStatus
      react_query_key: "none (mutation) — invalidate ['payments', paymentId], ['payments'] list, and ['invoice-details', invoiceId] + ['invoice-details'] list for every allocated invoice (amount_paid/status may have changed)"
      cache: "invalidate on success"
      loading: button spinner + confirm dialog (especially for CLEARED/FAILED — irreversible)
      pagination: none
      search: none
      sorting: none
      filters: none
      optimistic_update: false
    dependencies:
      lookup_apis: []
      related_endpoints: ["GET /apm/invoice-details/invoice/{invoice_id} (to see the updated amount_paid/status after CLEARED)"]
      business_rules:
        - "Disable the 'Mark Cleared'/'Mark Failed' actions in the UI once a payment is already CLEARED or FAILED — the backend will 422 but the button shouldn't be clickable."
        - "A FAILED payment does NOT roll back or unwind anything — since amount_paid is only touched on CLEARED, a failed payment simply stops reserving its allocated_amount (see the create-payment 'remaining payable amount' business rule) and a new payment can be created for the same invoice."

