    - CurrencyRequest
    - StatusMasterUpdateRequest
  response_models:
    - VendorResponse
    - VendorDTO
    - VendorAddressResponse
    - VendorAddressDTO
    - DeleteVendorAddressResponse
    - VendorBankResponse
    - VendorBankDTO
    - DeleteVendorBankResponse
    - VendorTaxResponse
