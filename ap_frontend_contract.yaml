          - { name: account_holder_name, type: string, required: true, default: null, validation: "non-empty after trim; 2-150 chars; letters/digits/spaces/& . , ' - ( ) / only; not numeric-only", enum: null }
          - { name: account_number, type: string, required: false, default: null, validation: "digits only, 6-20 digits if provided; at least one of account_number/iban is required; unique within this vendor's bank accounts (cross-vendor uniqueness only if VENDOR_BANK_DUPLICATE_ACROSS_VENDORS=true)", enum: null }
          - { name: iban, type: string, required: false, default: null, validation: "at least one of account_number/iban is required; unique within this vendor's bank accounts (cross-vendor uniqueness only if VENDOR_BANK_DUPLICATE_ACROSS_VENDORS=true)", enum: null }
          - { name: swift_code, type: string, required: false, default: null, validation: none, enum: null }
          - { name: routing_number, type: string, required: false, default: null, validation: none, enum: null }
          - { name: ifsc_code, type: string, required: false, default: null, validation: "format AAAA0XXXXXX if provided (normalized uppercase)", enum: null }
          - { name: is_primary, type: boolean, required: false, default: false, validation: "forced true if the vendor has no currently-active primary bank account", enum: null }
    response:
      success: { status: 200, body: "{ vendor_bank_id: int, message: string }" }
      error:
        - { status: 404, condition: "Vendor not found" }
        - { status: 422, condition: "empty bank_name/account_holder_name; invalid account_holder_name format; neither account_number nor iban provided; invalid account_number/ifsc_code format; duplicate account_number/iban" }
        - { status: 500, condition: "unexpected error" }
      model: VendorBankResponse
    frontend:
      screen: Vendor Detail — Bank Accounts tab
      service_name: createVendorBank
      react_query_key: "['vendors', vendorId, 'banks']"
      cache: "invalidate ['vendors', vendorId, 'banks'] and ['vendors', vendorId]"
      loading: button spinner
      pagination: none
      search: none
      sorting: none
      filters: none
      optimistic_update: false
    dependencies:
      lookup_apis: []
      related_endpoints: ["GET /apm/vendor/{vendor_id}/banks"]
      business_rules: ["effective_from defaults to today's date server-side; effective_to is null while active.", "'Active primary' is defined as is_primary=true AND effective_to IS NULL — the UI should surface effective_to on historical (superseded) rows."]

  - feature: Vendor Bank
    endpoint: /apm/vendor/{vendor_id}/banks
    method: GET
    description: List all bank accounts (including historical/superseded ones) for a vendor.
    request: { headers: { Authorization: "Bearer <token> (required)" }, path_params: { vendor_id: int }, query_params: {}, body: null }
    response: { success: { status: 200, body: "VendorBankDTO[]" }, error: [{ status: 404, condition: "Vendor not found" }, { status: 500, condition: "unexpected error" }], model: VendorBankDTO[] }
    frontend: { screen: Vendor Detail — Bank Accounts tab, service_name: getVendorBanks, react_query_key: "['vendors', vendorId, 'banks']", cache: "short TTL", loading: skeleton list, pagination: none, search: none, sorting: "server pre-sorted by vendor_bank_id asc", filters: "client-side filter for effective_to == null to show only active accounts", optimistic_update: n/a }
    dependencies: { lookup_apis: [], related_endpoints: [], business_rules: [] }

  - feature: Vendor Bank
    endpoint: /apm/vendor/{vendor_id}/banks/{bank_id}
    method: GET
    description: Get a single vendor bank account by ID.
    request: { headers: { Authorization: "Bearer <token> (required)" }, path_params: { vendor_id: int, bank_id: int }, query_params: {}, body: null }
    response: { success: { status: 200, body: VendorBankDTO }, error: [{ status: 404, condition: "Vendor not found OR Bank not found" }, { status: 500, condition: "unexpected error" }], model: VendorBankDTO }
    frontend: { screen: Vendor Detail — Bank edit modal, service_name: getVendorBank, react_query_key: "['vendors', vendorId, 'banks', bankId]", cache: standard, loading: skeleton, pagination: none, search: none, sorting: none, filters: none, optimistic_update: n/a }
    dependencies: { lookup_apis: [], related_endpoints: [], business_rules: [] }

  - feature: Vendor Bank
    endpoint: /apm/vendor/{vendor_id}/banks/{bank_id}
    method: PUT
    description: Update a vendor bank account. Same primary-versioning behavior as create applies when flipping is_primary to true.
    request:
      headers: { Authorization: "Bearer <token> (required)" }
      path_params: { vendor_id: int, bank_id: int }
      query_params: {}
      body:
        fields:
          - { name: bank_name, type: string, required: false, default: null, validation: "non-empty after trim if provided", enum: null }
          - { name: account_holder_name, type: string, required: false, default: null, validation: "non-empty after trim if provided; 2-150 chars; letters/digits/spaces/& . , ' - ( ) / only; not numeric-only", enum: null }
          - { name: account_number, type: string, required: false, default: null, validation: "digits only, 6-20 digits if provided; if account_number or iban is being changed, at least one of the two must remain set, and the resulting value is checked for duplicates (within-vendor always; cross-vendor only if VENDOR_BANK_DUPLICATE_ACROSS_VENDORS=true)", enum: null }
          - { name: iban, type: string, required: false, default: null, validation: "see account_number — same at-least-one and duplicate rules apply", enum: null }
          - { name: swift_code, type: string, required: false, default: null, validation: none, enum: null }
          - { name: routing_number, type: string, required: false, default: null, validation: none, enum: null }
          - { name: ifsc_code, type: string, required: false, default: null, validation: "format AAAA0XXXXXX if provided (normalized uppercase)", enum: null }
          - { name: is_primary, type: boolean, required: false, default: null, validation: "true closes out the current active primary (effective_to=today) before promoting this one; false simply unsets this row's primary flag", enum: null }
    response:
      success: { status: 200, body: VendorBankDTO }
      error:
        - { status: 404, condition: "Vendor not found OR Bank not found" }
        - { status: 422, condition: "empty bank_name/account_holder_name; invalid account_holder_name format; neither account_number nor iban remains set; invalid account_number/ifsc_code format; duplicate account_number/iban" }
        - { status: 500, condition: "unexpected error" }
      model: VendorBankDTO
    frontend: { screen: Vendor Detail — Bank edit modal, service_name: updateVendorBank, react_query_key: "['vendors', vendorId, 'banks']", cache: "invalidate ['vendors', vendorId, 'banks'] and ['vendors', vendorId]", loading: button spinner, pagination: none, search: none, sorting: none, filters: none, optimistic_update: false }
    dependencies: { lookup_apis: [], related_endpoints: [], business_rules: [] }

  - feature: Vendor Bank
    endpoint: /apm/vendor/{vendor_id}/banks/{bank_id}
    method: DELETE
    description: Delete a vendor bank account (hard delete — not the same as closing/superseding via effective_to).
    request: { headers: { Authorization: "Bearer <token> (required)" }, path_params: { vendor_id: int, bank_id: int }, query_params: {}, body: null }
    response: { success: { status: 200, body: "{ message: string }" }, error: [{ status: 404, condition: "Vendor not found OR Bank not found" }, { status: 500, condition: "unexpected error" }], model: DeleteVendorBankResponse }
    frontend: { screen: Vendor Detail — Bank Accounts tab, service_name: deleteVendorBank, react_query_key: "['vendors', vendorId, 'banks']", cache: "invalidate ['vendors', vendorId, 'banks'] and ['vendors', vendorId]", loading: confirm dialog + spinner, pagination: none, search: none, sorting: none, filters: none, optimistic_update: false }
    dependencies: { lookup_apis: [], related_endpoints: [], business_rules: ["Prefer 'deactivate/replace' (create a new primary, which auto-closes the old one) over hard delete for accounts referenced by payment history."] }

  # =========================================================
  # VENDOR MANAGEMENT — Vendor Tax (scoped to a Vendor Address)
  # =========================================================
  - feature: Vendor Tax
    endpoint: /apm/addresses/{vendor_address_id}/taxes
    method: POST
    description: "Add a tax registration (e.g. GSTIN) to a specific vendor address. NOTE: this path is NOT nested under /apm/vendor — it hangs directly off /apm/vendor's router at '/addresses/{vendor_address_id}/taxes', resolving to full path /apm/vendor/addresses/{vendor_address_id}/taxes."
    request:
      headers: { Authorization: "Bearer <token> (required)" }
      path_params: { vendor_address_id: int }
      query_params: {}
      body:
        fields:
          - { name: registration_type, type: string, required: true, default: null, validation: "non-empty after trim; normalized to uppercase; unique per (vendor_address_id, registration_type)", enum: null }
          - { name: registration_number, type: string, required: true, default: null, validation: "non-empty after trim; normalized to uppercase", enum: null }
    response:
      success: { status: 200, body: "{ vendor_tax_id: int, message: string }" }
      error:
        - { status: 404, condition: "Address not found" }
        - { status: 422, condition: "empty registration_type/registration_number; duplicate registration_type for this address (pre-check)" }
        - { status: 409, condition: "duplicate registration_type for this address — DB unique constraint fallback" }
        - { status: 500, condition: "unexpected error" }
      model: VendorTaxResponse
    frontend:
      screen: Vendor Detail — Address → Tax Registrations
      service_name: createVendorTax
      react_query_key: "['vendor-addresses', vendorAddressId, 'taxes']"
      cache: "invalidate ['vendor-addresses', vendorAddressId, 'taxes'] and the parent vendor's ['vendors', vendorId] (VendorDTO embeds vendor_tax under each address)"
      loading: button spinner
      pagination: none
      search: none
      sorting: none
      filters: none
      optimistic_update: false
    dependencies:
      lookup_apis: ["GET /apm/system/gstin/{gstin} (optional auto-fill for registration_number when registration_type is a GST identifier)"]
      related_endpoints: ["GET /apm/addresses/{vendor_address_id}/taxes"]
      business_rules: ["is_verified defaults to false; there is no endpoint in this module that sets is_verified=true — verification is presumably handled by another workflow/module not present in this codebase."]

  - feature: Vendor Tax
    endpoint: /apm/addresses/{vendor_address_id}/taxes
    method: GET
    description: List all tax registrations for a vendor address.
    request: { headers: { Authorization: "Bearer <token> (required)" }, path_params: { vendor_address_id: int }, query_params: {}, body: null }
    response: { success: { status: 200, body: "VendorTaxDTO[]" }, error: [{ status: 404, condition: "Address not found" }, { status: 500, condition: "unexpected error" }], model: VendorTaxDTO[] }
    frontend: { screen: Vendor Detail — Address → Tax Registrations, service_name: getVendorTaxes, react_query_key: "['vendor-addresses', vendorAddressId, 'taxes']", cache: "short TTL", loading: skeleton list, pagination: none, search: none, sorting: "server pre-sorted by vendor_tax_id asc", filters: none, optimistic_update: n/a }
    dependencies: { lookup_apis: [], related_endpoints: [], business_rules: [] }

  - feature: Vendor Tax
    endpoint: /apm/addresses/{vendor_address_id}/taxes/{tax_id}
    method: GET
    description: Get a single tax registration by ID.
    request: { headers: { Authorization: "Bearer <token> (required)" }, path_params: { vendor_address_id: int, tax_id: int }, query_params: {}, body: null }
    response: { success: { status: 200, body: VendorTaxDTO }, error: [{ status: 404, condition: "Address not found OR Tax not found" }, { status: 500, condition: "unexpected error" }], model: VendorTaxDTO }
    frontend: { screen: Vendor Detail — Tax registration edit modal, service_name: getVendorTax, react_query_key: "['vendor-addresses', vendorAddressId, 'taxes', taxId]", cache: standard, loading: skeleton, pagination: none, search: none, sorting: none, filters: none, optimistic_update: n/a }
    dependencies: { lookup_apis: [], related_endpoints: [], business_rules: [] }

  - feature: Vendor Tax
    endpoint: /apm/addresses/{vendor_address_id}/taxes/{tax_id}
    method: PUT
    description: Update a tax registration. Changing registration_type or registration_number resets is_verified to false (and clears verified_at).
    request:
      headers: { Authorization: "Bearer <token> (required)" }
      path_params: { vendor_address_id: int, tax_id: int }
      query_params: {}
      body:
        fields:
          - { name: registration_type, type: string, required: false, default: null, validation: "non-empty after trim if provided; normalized to uppercase; unique per address excluding self", enum: null }
          - { name: registration_number, type: string, required: false, default: null, validation: "non-empty after trim if provided; normalized to uppercase", enum: null }
    response:
      success: { status: 200, body: VendorTaxDTO }
      error:
        - { status: 404, condition: "Address not found OR Tax not found" }
        - { status: 422, condition: "empty fields; duplicate registration_type for this address (pre-check)" }
        - { status: 409, condition: "duplicate registration_type for this address — DB unique constraint fallback" }
        - { status: 500, condition: "unexpected error" }
      model: VendorTaxDTO
    frontend: { screen: Vendor Detail — Tax registration edit modal, service_name: updateVendorTax, react_query_key: "['vendor-addresses', vendorAddressId, 'taxes']", cache: "invalidate ['vendor-addresses', vendorAddressId, 'taxes']", loading: button spinner, pagination: none, search: none, sorting: none, filters: none, optimistic_update: false }
    dependencies: { lookup_apis: [], related_endpoints: [], business_rules: ["Warn the user that editing registration_type/registration_number un-verifies a previously verified registration."] }

  - feature: Vendor Tax
    endpoint: /apm/addresses/{vendor_address_id}/taxes/{tax_id}
    method: DELETE
    description: Delete a tax registration.
    request: { headers: { Authorization: "Bearer <token> (required)" }, path_params: { vendor_address_id: int, tax_id: int }, query_params: {}, body: null }
    response: { success: { status: 200, body: "{ message: string }" }, error: [{ status: 404, condition: "Address not found OR Tax not found" }, { status: 500, condition: "unexpected error" }], model: DeleteVendorTaxResponse }
    frontend: { screen: Vendor Detail — Address → Tax Registrations, service_name: deleteVendorTax, react_query_key: "['vendor-addresses', vendorAddressId, 'taxes']", cache: "invalidate ['vendor-addresses', vendorAddressId, 'taxes']", loading: confirm dialog + spinner, pagination: none, search: none, sorting: none, filters: none, optimistic_update: false }
    dependencies: { lookup_apis: [], related_endpoints: [], business_rules: [] }

