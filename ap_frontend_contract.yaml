  # =========================================================
  # INVOICE PROCESSING / OCR (added 2026-08-13)
  # =========================================================
  # Pipeline: upload -> technical classification -> text extraction (native
  # PDF text layer, or OCR via rapidocr/onnxruntime for scanned pages/images,
  # with an AWS Textract quality-gated fallback that is stubbed/not yet
  # implemented — see Business_Layer/utils/ocr_provider.aws_textract_extract)
  # -> quality scoring -> field extraction (anchor/regex/geometry rules, no
  # AI) -> business validation -> vendor matching -> confidence scoring ->
  # persistence. /upload-document, /extract-fields, /validate-fields,
  # /match-vendor are "developer APIs" that expose each stage individually
  # for debugging; /process-invoice is the single production endpoint that
  # runs the full pipeline and persists the result. All five share the same
  # underlying functions in Business_Layer/services/invoice_process_service.py
  # — behavior never diverges between the debug and production paths.
  - feature: Invoice Upload (developer API)
    endpoint: /apm/invoice/upload-document
    method: POST
    description: "Upload a document and run technical classification + text extraction only (no field extraction). Debugging/inspection tool, not part of the production flow."
    request:
      headers: { Authorization: "Bearer <token> (required)", Content-Type: multipart/form-data }
      path_params: {}
      query_params: {}
      body: { fields: [{ name: file, type: file, required: true, default: null, validation: "PDF/PNG/JPEG/TIFF only", enum: null }] }
    response:
      success: { status: 200, body: DocumentResult }
      error:
        - { status: 415, condition: "unsupported file type" }
        - { status: 422, condition: "OCR failure" }
        - { status: 500, condition: "unexpected error" }
      model: DocumentResult
    frontend:
      screen: "Developer/QA tooling only — not intended for the production upload screen (use /process-invoice instead)"
      service_name: uploadDocumentDebug
      react_query_key: none (mutation, no cache)
      cache: none
      loading: button spinner
      pagination: none
      search: none
      sorting: none
      filters: none
      optimistic_update: false
    dependencies: { lookup_apis: [], related_endpoints: ["POST /apm/invoice/extract-fields"], business_rules: ["Returns raw per-page word/text data (DocumentResult.pages[].words) — large payload, do not render directly in a table."] }

  - feature: Invoice Field Extraction (developer API)
    endpoint: /apm/invoice/extract-fields
    method: POST
    description: Rule-based field extraction (anchors/regex/geometry, no AI) from a DocumentResult produced by /upload-document.
    request:
      headers: { Authorization: "Bearer <token> (required)", Content-Type: application/json }
      path_params: {}
      query_params: {}
      body: { fields: [{ name: "(entire body)", type: DocumentResult, required: true, default: null, validation: "must be the exact response of POST /upload-document", enum: null }] }
    response:
      success: { status: 200, body: ExtractedInvoice }
      error: [{ status: 422, condition: "field extraction error" }, { status: 500, condition: "unexpected error" }]
      model: ExtractedInvoice
    frontend: { screen: "Developer/QA tooling only", service_name: extractFieldsDebug, react_query_key: none, cache: none, loading: button spinner, pagination: none, search: none, sorting: none, filters: none, optimistic_update: false }
    dependencies: { lookup_apis: [], related_endpoints: ["POST /apm/invoice/upload-document", "POST /apm/invoice/validate-fields", "POST /apm/invoice/match-vendor"], business_rules: [] }

  - feature: Invoice Field Validation (developer API)
    endpoint: /apm/invoice/validate-fields
    method: POST
    description: Business validation (GSTIN format, invoice date, due date, totals, invoice number) over an ExtractedInvoice.
    request:
      headers: { Authorization: "Bearer <token> (required)", Content-Type: application/json }
      path_params: {}
      query_params: {}
      body: { fields: [{ name: "(entire body)", type: ExtractedInvoice, required: true, default: null, validation: none, enum: null }] }
    response:
      success: { status: 200, body: ValidationResult }
      error: [{ status: 422, condition: "validation failure raised as an exception (rare — most validation issues are returned inside ValidationResult.errors, not as an HTTP error)" }, { status: 500, condition: "unexpected error" }]
      model: ValidationResult
    frontend: { screen: "Developer/QA tooling only", service_name: validateFieldsDebug, react_query_key: none, cache: none, loading: button spinner, pagination: none, search: none, sorting: none, filters: none, optimistic_update: false }
    dependencies: { lookup_apis: [], related_endpoints: [], business_rules: [] }

  - feature: Invoice Vendor Matching (developer API)
    endpoint: /apm/invoice/match-vendor
    method: POST
    description: Match an ExtractedInvoice against the vendor master (by GSTIN/name — see Business_Layer/utils/vendor_matcher.py).
    request:
      headers: { Authorization: "Bearer <token> (required)", Content-Type: application/json }
      path_params: {}
      query_params: {}
      body: { fields: [{ name: "(entire body)", type: ExtractedInvoice, required: true, default: null, validation: none, enum: null }] }
    response:
      success: { status: 200, body: VendorMatch }
      error: [{ status: 404, condition: "VendorNotFound" }, { status: 500, condition: "unexpected error" }]
      model: VendorMatch
    frontend: { screen: "Developer/QA tooling only", service_name: matchVendorDebug, react_query_key: none, cache: none, loading: button spinner, pagination: none, search: none, sorting: none, filters: none, optimistic_update: false }
    dependencies: { lookup_apis: [], related_endpoints: [], business_rules: [] }

  - feature: Invoice Processing (production pipeline)
    endpoint: /apm/invoice/process-invoice
    method: POST
    description: "THE production upload endpoint. Validates the file, uploads it to S3, creates an InboundDocument row, runs the full OCR/extraction/validation/vendor-matching/confidence pipeline, then persists per the Path A/Path B split (see business_rules). This is what the Invoice Upload screen should call — not /upload-document."
    request:
      headers: { Authorization: "Bearer <token> (required)", Content-Type: multipart/form-data }
      path_params: {}
      query_params: {}
      body: { fields: [{ name: file, type: file, required: true, default: null, validation: "PDF/PNG/JPEG/TIFF only, non-empty", enum: null }] }
    response:
      success: { status: 200, body: FinalResponse }
      error:
        - { status: 400, condition: "invalid/empty upload file" }
        - { status: 415, condition: "unsupported file type" }
        - { status: 422, condition: "missing user identifier (token); OCR/field-extraction failure (InboundDocument marked FAILED, no Invoice created); extraction produced an unusable result (missing invoice_number/invoice_date/amount)" }
        - { status: 409, condition: "duplicate invoice for this vendor+invoice_number (InboundDocument linked to the existing invoice, no new Invoice row created)" }
        - { status: 500, condition: "unexpected error during extraction or persistence" }
      model: FinalResponse
    frontend:
      screen: Invoice Upload
      service_name: processInvoice
      react_query_key: none (mutation) — invalidate ["invoice-details"] list on success
      cache: "invalidate ['invoice-details'] list on success"
      loading: button spinner / progress indicator (OCR can be slow for scanned documents)
      pagination: none
      search: none
      sorting: none
      filters: none
      optimistic_update: false
    dependencies:
      lookup_apis: []
      related_endpoints: ["PATCH /apm/invoice/inbound-documents/{inbound_document_id}/ocr-review", "GET /apm/invoice-details/invoice/{invoice_id}"]
      business_rules:
        - "Path A (vendor matched by GSTIN/name, OR auto-onboarded from a GST-verified GSTIN when match fails and confidence is high enough — see vendor_auto_onboarding.py): Invoice + InvoiceLine(s) + InvoiceAttachment + InvoiceIssue(s) are created in ONE transaction at status OCR_REVIEW_PENDING. response.invoice_id and response.invoice_status are populated."
        - "Path B (vendor not matched and not eligible for auto-onboarding): only the InboundDocument is updated (extraction_status=EXTRACTED, raw_extracted_data populated); no Invoice is created yet. response.invoice_id is null and response.invoice_status = 'PENDING_VENDOR_ONBOARDING'. A notification email is sent (Business_Layer/utils/notifications.notify_vendor_not_found). The frontend MUST branch on invoice_status: PENDING_VENDOR_ONBOARDING means the next required action is manual OCR review with a vendor_id supplied (see PATCH .../ocr-review), not a redirect to an invoice detail page."
        - "InvoiceIssue rows are auto-created (severity WARNING/INFO, never blocking) for: overall confidence below 80, validation errors, line-total/subtotal mismatch beyond a ₹1.00 tolerance, unmapped currency (defaults to INR), or line items that had too little data to persist."
        - "Duplicate detection is by (vendor_id, invoice_number) — if Path A's matched/onboarded vendor already has an invoice with the same invoice_number, the InboundDocument is linked to the EXISTING invoice_id and a 409 is returned; no new Invoice row is created."
        - "This is a genuinely slow endpoint (OCR on scanned pages can take several seconds) — do not set an aggressive client-side request timeout."

  - feature: Manual OCR Review
    endpoint: /apm/invoice/inbound-documents/{inbound_document_id}/ocr-review
    method: PATCH
    description: "AP Executive confirms/corrects an OCR-extracted invoice. Creates the Invoice for the first time when Path B occurred at /process-invoice (vendor_id required in the body in that case), or updates the existing invoice when Path A already created one. Either way, always ends at invoice status PENDING_APPROVAL and resolves (marks resolved_by/resolved_at on) any still-open InvoiceIssue rows for that invoice."
    request:
      headers: { Authorization: "Bearer <token> (required)", Content-Type: application/json }
      path_params: { inbound_document_id: int }
      query_params: {}
      body:
        fields:
          - { name: vendor_id, type: integer, required: conditional, default: null, validation: "REQUIRED if this document's vendor was not auto-matched at /process-invoice time (Path B); ignored/optional otherwise", enum: null }
          - { name: invoice_number, type: string, required: conditional, default: null, validation: "required to create (Path B first call); unique per (vendor_id, invoice_number)", enum: null }
          - { name: invoice_type, type: string, required: false, default: NON_PO, validation: none, enum: [PO, NON_PO] }
          - { name: invoice_date, type: date, required: conditional, default: null, validation: "required to create (Path B first call)", enum: null }
          - { name: due_date, type: date, required: conditional, default: null, validation: "required to create (Path B first call)", enum: null }
          - { name: currency_id, type: integer, required: conditional, default: null, validation: "required to create (Path B first call); must reference an existing currency", enum: null }
          - { name: gross_amount, type: decimal, required: conditional, default: null, validation: "required to create (Path B first call)", enum: null }
          - { name: discount_amount, type: decimal, required: false, default: 0, validation: none, enum: null }
          - { name: tax_amount, type: decimal, required: false, default: 0, validation: none, enum: null }
          - { name: net_amount, type: decimal, required: conditional, default: null, validation: "required to create (Path B first call)", enum: null }
          - { name: po_id, type: integer, required: false, default: null, validation: "no FK existence check performed by this endpoint", enum: null }
          - { name: payment_term_id, type: integer, required: false, default: null, validation: "no FK existence check performed by this endpoint", enum: null }
          - { name: lines, type: "array of {line_number, description, quantity, unit_price, line_amount, tax_amount, tax_type_id}", required: false, default: null, validation: "a line_number matching an existing InvoiceLine updates it; a new line_number inserts a new line; omitting `lines` entirely leaves existing lines untouched", enum: null }
      note: "On the CREATE branch (Path B), all of invoice_number/invoice_date/due_date/currency_id/gross_amount/net_amount are actually required — the schema marks them optional only because the same body shape is reused for the UPDATE branch."
    response:
      success: { status: 200, body: "{ success: true, message: string, data: { invoice_id: int, status_id: int } }" }
      error:
        - { status: 422, condition: "vendor_id missing on Path B create; missing required field(s) to create the invoice; missing user identifier" }
        - { status: 409, condition: "DuplicateInvoiceError — invoice_number already exists for this vendor" }
        - { status: 500, condition: "unexpected error, including 'InboundDocument not found' (currently surfaces as 500, not 404 — see business_rules)" }
      model: none (uses Backend/API_Layer/utils/response_utils.success_response — the only route in this codebase that uses that helper)
    frontend:
      screen: OCR Review / Manual Correction
      service_name: submitOcrReview
      react_query_key: none (mutation) — invalidate ["invoice-details", invoiceId] and the invoice-details list on success
      cache: "invalidate on success"
      loading: button spinner
      pagination: none
      search: none
      sorting: none
      filters: none
      optimistic_update: false
    dependencies:
      lookup_apis: ["GET /apm/vendor (to let the AP Executive pick a vendor for Path B)", "GET /apm/master/payment-term", "GET /apm/master/tax-type"]
      related_endpoints: ["POST /apm/invoice/process-invoice", "GET /apm/invoice-details/invoice/{invoice_id}"]
      business_rules:
        - "A request for an inbound_document_id that does not exist raises a bare ValueError, which this route does NOT catch specially — it falls through to the generic except Exception -> HTTP 500, NOT a 404. Frontend should treat any 500 from this endpoint on a not-found ID as effectively 'not found', but the backend does not distinguish it cleanly today."
        - "The response body breaks from every other route's convention: {success, message, data} instead of returning the model directly (see 'response_wrapper' note above — this is the one exception)."

